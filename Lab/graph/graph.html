<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GANITH — Advanced Mathematical Graphing & Visualization</title>
<script src="https://cdn.jsdelivr.net/npm/mathjs@14.0.1/lib/browser/math.js"></script>
<style>
:root{
  --bg:#f7f9fc;--panel:#ffffff;--panel2:#f3f6fa;--border:#d5ddea;
  --text:#182235;--muted:#72809a;--accent:#2f6fed;--accent2:#4f46e5;
  --grid:#dce4ef;--axis:#6b7890;--danger:#dc3545;
  --shadow:0 2px 10px rgba(24,34,53,.08);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:grid;grid-template-rows:54px 1fr 48px}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--border);z-index:10}
.brand{display:flex;align-items:center;gap:10px;margin-right:4px}
.logo{width:44px;height:44px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}
.brand-title{font-size:18px;font-weight:850;letter-spacing:.5px;line-height:1}
.brand-sub{font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:.25px}
.topbtn{height:38px;padding:0 13px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-weight:600}
.topbtn:hover{background:var(--panel2)}
.top-spacer{flex:1}
select.top-select{height:38px;border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:0 12px;color:var(--text)}
.main{min-height:0;display:grid;grid-template-columns:360px 1fr}
.sidebar{min-width:0;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);overflow:hidden}
.section-head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--border);font-weight:800;font-size:12px;letter-spacing:.6px}
.expr-list{overflow:auto;flex:1;padding:8px 8px 0}
.expr-card{border:1px solid var(--border);border-radius:10px;padding:9px;margin-bottom:8px;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.03)}
.expr-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px rgba(47,111,237,.12)}
.expr-row{display:flex;align-items:center;gap:7px}
.color-dot{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--border);flex:none}
.expr-input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-family:"Cambria Math",Georgia,serif;font-size:16px}
.icon-btn{border:0;background:transparent;color:var(--muted);padding:4px;border-radius:5px}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.expr-tools{display:flex;gap:5px;margin:7px 0 0 27px}
.mini{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:6px;padding:4px 8px;font-size:11px}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.add-row{display:grid;grid-template-columns:1fr;gap:7px;padding:8px;border-top:1px solid var(--border)}
.add-row button{height:44px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-weight:600}
.add-row button.primary{background:var(--accent);color:white;border-color:var(--accent);font-size:15px}
.add-row button.primary:hover{background:#2558c8}
.function-library{border-top:1px solid var(--border);background:var(--panel);max-height:365px;overflow-y:auto;flex:none}
.function-library-header{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;border-bottom:1px solid var(--border);font-size:10px;font-weight:900;letter-spacing:1px;position:sticky;top:0;background:var(--panel);z-index:2}
.small-btn{border:1px solid var(--border);background:var(--panel2);border-radius:6px;padding:4px 7px;font-size:10px;color:var(--text)}
.function-group{border-bottom:1px solid var(--border)}
.function-group-title{width:100%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:space-between;padding:8px 9px;cursor:pointer;font-size:11px;font-weight:700;text-align:left}
.function-group-title:hover{background:var(--panel2)}
.function-group-title small{color:var(--muted);font-size:9px;font-weight:400}
.function-buttons{display:none;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 7px 7px}
.function-group.open .function-buttons{display:grid}
.function-group.open .function-group-title span{color:var(--accent)}
.function-buttons button{min-height:29px;padding:4px 3px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);cursor:pointer;font-family:"Cambria Math",Georgia,serif;font-size:12px}
.function-buttons button:hover{background:var(--accent);color:white;border-color:var(--accent);transform:translateY(-1px)}
.canvas-wrap{position:relative;min-width:0;min-height:0;background:#fff}
#graph{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint,.mode-pill,.coords{position:absolute;top:14px;padding:8px 11px;border:1px solid var(--border);background:rgba(255,255,255,.93);border-radius:9px;box-shadow:var(--shadow);font-size:12px;color:var(--muted);pointer-events:none}
.hint{left:14px}.mode-pill{left:50%;transform:translateX(-50%)}.coords{right:14px;font-variant-numeric:tabular-nums}
.status{position:absolute;left:14px;bottom:14px;padding:7px 10px;background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--muted);pointer-events:none;max-width:60%}
.bottom{display:flex;align-items:center;gap:7px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--border);z-index:10}
.toolbtn{height:34px;padding:0 11px;border:1px solid var(--border);background:var(--panel);border-radius:8px;color:var(--text);font-size:12px}
.toolbtn:hover,.toolbtn.active{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.bottom-spacer{flex:1}
.precision{font-size:11px;color:var(--muted)}
.dialog-backdrop{display:none;position:fixed;inset:0;background:rgba(10,18,32,.35);z-index:50;align-items:center;justify-content:center}
.dialog-backdrop.show{display:flex}
.dialog{width:min(560px,92vw);max-height:82vh;overflow:auto;background:var(--panel);border-radius:14px;box-shadow:0 20px 70px rgba(0,0,0,.25);border:1px solid var(--border);padding:18px}
.dialog h2{margin:0 0 12px;font-size:18px}
.dialog pre{white-space:pre-wrap;background:var(--panel2);padding:12px;border-radius:8px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dialog input{width:100%;padding:9px;border:1px solid var(--border);border-radius:7px}
/* Legend Styles */
.legend {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(255,255,255,.93);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 14px;
  box-shadow: var(--shadow);
  pointer-events: none;
  font-size: 13px;
  color: var(--text);
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 80%;
  overflow-y: auto;
  z-index: 5;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}
.legend-color {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.1);
  flex-shrink: 0;
}
/* Export range dialog */
.range-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.range-field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted)}
.range-field input{width:100%;padding:9px;border:1px solid var(--border);border-radius:7px;font-variant-numeric:tabular-nums}
.export-note{font-size:12px;color:var(--muted);margin:4px 0 0}
.export-error{min-height:16px;font-size:12px;color:var(--danger);font-weight:600;margin-top:6px}
@media(max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr}
  .sidebar{position:fixed;left:0;top:54px;bottom:48px;width:min(390px,92vw);z-index:20;transform:translateX(-102%);transition:transform .2s;box-shadow:12px 0 30px rgba(0,0,0,.15)}
  .sidebar.open{transform:translateX(0)}
  .brand-sub{display:none}
  .topbtn.hide-mobile{display:none}
  .hint{top:10px;left:10px}
  .function-buttons{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <div class="logo">Σ</div>
    <div>
      <div class="brand-title">GANITH</div>
      <div class="brand-sub">ADVANCED MATHEMATICAL GRAPHING &amp; VISUALIZATION</div>
    </div>
  </div>
  <button class="topbtn" id="newBtn">New</button>
  <!-- Removed Save and Load buttons here -->
  <button class="topbtn hide-mobile" id="undoBtn">↶ Undo</button>
  <button class="topbtn hide-mobile" id="redoBtn">↷ Redo</button>
  <button class="topbtn" id="exportBtn">Export</button>
  <div class="top-spacer"></div>
  <button class="topbtn" id="settingsBtn">⚙</button>
  <button class="topbtn" id="sidebarBtn">☰</button>
  <select class="top-select" id="modeSelect">
    <option value="cartesian">Cartesian</option>
    <option value="polar">Polar</option>
    <option value="parametric">Parametric</option>
    <option value="implicit">Implicit</option>
  </select>
</header>
<main class="main">
<aside class="sidebar" id="sidebar">
  <div class="section-head">
    <span>EXPRESSIONS</span>
    <span id="exprCount">0</span>
  </div>
  <div class="expr-list" id="expressionList"></div>
  <div class="function-library">
    <div class="function-library-header">
      <span>MATHEMATICAL FUNCTIONS</span>
      <button class="small-btn" id="expandFunctions">Expand</button>
    </div>
    <div class="function-group">
      <button class="function-group-title" onclick="FunctionLibrary.toggle(this)"><span>▸ Trigonometric</span><small>sin cos tan</small></button>
      <div class="function-buttons">
        <button onclick="FunctionLibrary.insert('sin(')">sin</button>
        <button onclick="FunctionLibrary.insert('cos(')">cos</button>
        <button onclick="FunctionLibrary.insert('tan(')">tan</button>
        <button onclick="FunctionLibrary.insert('sec(')">sec</button>
        <button onclick="FunctionLibrary.insert('csc(')">csc</button>
        <button onclick="FunctionLibrary.insert('cot(')">cot</button>
      </div>
    </div>
    <div class="function-group">
      <button class="function-group-title" onclick="FunctionLibrary.toggle(this)"><span>▸ Inverse Trigonometric</span><small>asin acos atan</small></button>
      <div class="function-buttons">
        <button onclick="FunctionLibrary.insert('asin(')">sin⁻¹</button>
        <button onclick="FunctionLibrary.insert('acos(')">cos⁻¹</button>
        <button onclick="FunctionLibrary.insert('atan(')">tan⁻¹</button>
        <button onclick="FunctionLibrary.insert('asec(')">sec⁻¹</button>
        <button onclick="FunctionLibrary.insert('acsc(')">csc⁻¹</button>
        <button onclick="FunctionLibrary.insert('acot(')">cot⁻¹</button>
      </div>
    </div>
    <div class="function-group">
      <button class="function-group-title" onclick="FunctionLibrary.toggle(this)"><span>▸ Hyperbolic</span><small>sinh cosh tanh</small></button>
      <div class="function-buttons">
        <button onclick="FunctionLibrary.insert('sinh(')">sinh</button>
        <button onclick="FunctionLibrary.insert('cosh(')">cosh</button>
        <button onclick="FunctionLibrary.insert('tanh(')">tanh</button>
        <button onclick="FunctionLibrary.insert('sech(')">sech</button>
        <button onclick="FunctionLibrary.insert('csch(')">csch</button>
        <button onclick="FunctionLibrary.insert('coth(')">coth</button>
      </div>
    </div>
    <div class="function-group">
      <button class="function-group-title" onclick="FunctionLibrary.toggle(this)"><span>▸ Inverse Hyperbolic</span><small>asinh acosh atanh</small></button>
      <div class="function-buttons">
        <button onclick="FunctionLibrary.insert('asinh(')">sinh⁻¹</button>
        <button onclick="FunctionLibrary.insert('acosh(')">cosh⁻¹</button>
        <button onclick="FunctionLibrary.insert('atanh(')">tanh⁻¹</button>
        <button onclick="FunctionLibrary.insert('asech(')">sech⁻¹</button>
        <button onclick="FunctionLibrary.insert('acsch(')">csch⁻¹</button>
        <button onclick="FunctionLibrary.insert('acoth(')">coth⁻¹</button>
      </div>
    </div>
    <div class="function-group">
      <button class="function-group-title" onclick="FunctionLibrary.toggle(this)"><span>▸ Logarithmic</span><small>ln log log₂</small></button>
      <div class="function-buttons">
        <button onclick="FunctionLibrary.insert('ln(')">ln</button>
        <button onclick="FunctionLibrary.insert('log10(')">log₁₀</button>
        <button onclick="FunctionLibrary.insert('log2(')">log₂</button>
        <button onclick="FunctionLibrary.insert('logb(')">logb</button>
      </div>
    </div>
    <div class="function-group">
      <button class="function-group-title" onclick="FunctionLibrary.toggle(this)"><span>▸ Exponential</span><small>eˣ 10ˣ</small></button>
      <div class="function-buttons">
        <button onclick="FunctionLibrary.insert('exp(')">eˣ</button>
        <button onclick="FunctionLibrary.insert('10^(')">10ˣ</button>
        <button onclick="FunctionLibrary.insert('2^(')">2ˣ</button>
        <button onclick="FunctionLibrary.insert('pow(')">aˣ</button>
      </div>
    </div>
  </div>
  <div class="add-row">
    <button class="primary" id="addExpressionBtn">＋ Expression</button>
  </div>
</aside>
<section class="canvas-wrap">
  <canvas id="graph"></canvas>
  <div class="legend" id="legend"></div>
  <div class="coords" id="coords">X: 0.000 Y: 0.000</div>
  <div class="status" id="status">Ready</div>
</section>
</main>
<footer class="bottom">
  <button class="toolbtn" id="toolsBtn">Tools</button>
  <button class="toolbtn" id="resetBtn">Reset View</button>
  <button class="toolbtn" id="fitBtn">Fit All</button>
  <button class="toolbtn" id="originBtn">Origin</button>
  <button class="toolbtn" id="traceBtn">Trace</button>
  <button class="toolbtn" id="animateBtn">▶ Animation</button>
  <div class="bottom-spacer"></div>
  <span class="precision">Angle: <b id="angleMode">Radians</b></span>
  <button class="toolbtn" id="angleBtn">Deg/Rad</button>
</footer>
</div>
<div class="dialog-backdrop" id="dialogBackdrop">
  <div class="dialog">
    <h2 id="dialogTitle">GANITH</h2>
    <div id="dialogBody"></div>
    <div class="dialog-actions">
      <button class="topbtn" id="dialogClose">Close</button>
    </div>
  </div>
</div>
<script>
"use strict";

function uid(){
  if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
    try { return crypto.randomUUID(); } catch(e){}
  }
  if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function") {
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map(x => x.toString(16).padStart(2,"0"));
    return h.slice(0,4).join("")+"-"+h.slice(4,6).join("")+"-"+h.slice(6,8).join("")+"-"+h.slice(8,10).join("")+"-"+h.slice(10,16).join("");
  }
  return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
}

const COLORS = ["#315bd6","#e53935","#169c6b","#8e44ad","#e67e22","#0097a7","#c2185b","#5d6d7e"];

const FUNCTION_TOKENS = [
  "sinh","cosh","tanh","sech","csch","coth",
  "asin","acos","atan","asec","acsc","acot",
  "asinh","acosh","atanh","asech","acsch","acoth",
  "sin","cos","tan","sec","csc","cot",
  "log10","log2","logb","log","ln",
  "exp","sqrt","cbrt","pow","abs","sign",
  "floor","ceil","round","trunc","frac",
  "min","max","clamp","hypot",
  "factorial","gcd","lcm","mod","isPrime",
  "nPr","nCr","doubleFactorial",
  "mean","median","mode","variance","stddev","sum",
  "gamma","erf","erfc","sinc","positivePart","negativePart"
];
FUNCTION_TOKENS.sort((a,b)=>b.length-a.length);

const App = {
  state:{
    expressions:[],selected:null,points:[],segments:[],circles:[],
    angleMode:"rad",mode:"cartesian",trace:false,animating:false,t:0
  },
  history:[],future:[],suppressHistory:false,

  init(){
    this.registerMathFunctions();
    this.loadDemo();
    UI.bind();
    Graph.init();
    requestAnimationFrame(()=>{ Graph.resize(); this.render(); });
    this.render();
  },

  registerMathFunctions(){
    const f = {};
    const isDeg = () => App.state.angleMode === "deg";
    const degToRad = x => x * Math.PI / 180;
    const radToDeg = x => x * 180 / Math.PI;

    // Trigonometric functions (input conversion)
    f.sin = x => Math.sin(isDeg() ? degToRad(x) : x);
    f.cos = x => Math.cos(isDeg() ? degToRad(x) : x);
    f.tan = x => Math.tan(isDeg() ? degToRad(x) : x);
    f.sec = x => 1 / f.cos(x);
    f.csc = x => 1 / f.sin(x);
    f.cot = x => 1 / f.tan(x);
    
    // Inverse trigonometric functions (output conversion)
    f.asin = x => {
        const res = Math.asin(x);
        return isDeg() ? radToDeg(res) : res;
    };
    f.acos = x => {
        const res = Math.acos(x);
        return isDeg() ? radToDeg(res) : res;
    };
    f.atan = x => {
        const res = Math.atan(x);
        return isDeg() ? radToDeg(res) : res;
    };
    f.asec = x => f.acos(1/x);
    f.acsc = x => f.asin(1/x);
    f.acot = x => {
        // Standard acot(x) range is (0, π)
        const res = Math.PI/2 - Math.atan(x);
        return isDeg() ? radToDeg(res) : res;
    };

    // Hyperbolic functions
    f.sinh = x => Math.sinh(x);
    f.cosh = x => Math.cosh(x);
    f.tanh = x => Math.tanh(x);
    f.sech = x => 1/Math.cosh(x);
    f.csch = x => 1/Math.sinh(x);
    f.coth = x => 1/Math.tanh(x);

    // Inverse Hyperbolic functions
    f.asinh = x => Math.asinh(x);
    f.acosh = x => Math.acosh(x);
    f.atanh = x => Math.atanh(x);
    f.asech = x => Math.acosh(1/x);
    f.acsch = x => Math.asinh(1/x);
    f.acoth = x => Math.atanh(1/x);

    // Logarithmic & Exponential
    f.log10 = x => Math.log10(x);
    f.log2 = x => Math.log2(x);
    f.logb = (x,b) => Math.log(x)/Math.log(b);
    f.exp = x => Math.exp(x);
    f.cbrt = x => Math.cbrt(x);

    // Other functions
    f.positivePart = x => Math.max(x,0);
    f.negativePart = x => Math.min(x,0);
    f.clamp = (x,a,b) => Math.min(Math.max(x,a),b);
    f.frac = x => x-Math.floor(x);
    f.factorial = n => { n=Math.trunc(n); if(n<0 || n>170) return NaN; let r=1; for(let i=2;i<=n;i++) r*=i; return r; };
    f.gcd = (a,b) => { a=Math.abs(Math.trunc(a)); b=Math.abs(Math.trunc(b)); while(b){let t=b;b=a%b;a=t} return a; };
    f.lcm = (a,b) => { a=Math.trunc(a); b=Math.trunc(b); if(a===0 || b===0) return 0; return Math.abs(a*b/f.gcd(a,b)); };
    f.mod = (a,b) => a%b;
    f.isPrime = n => { n=Math.trunc(n); if(n<2)return 0; if(n===2)return 1; if(n%2===0)return 0; for(let i=3;i*i<=n;i+=2) if(n%i===0)return 0; return 1; };
    f.nPr = (n,r) => { n=Math.trunc(n); r=Math.trunc(r); if(r<0 || n<0 || r>n)return NaN; let z=1; for(let i=0;i<r;i++) z*=n-i; return z; };
    f.nCr = (n,r) => { n=Math.trunc(n); r=Math.trunc(r); if(r<0 || n<0 || r>n)return NaN; r=Math.min(r,n-r); let z=1; for(let i=1;i<=r;i++) z=z*(n-r+i)/i; return z; };
    f.doubleFactorial = n => { n=Math.trunc(n); if(n<0)return NaN; let z=1; for(let i=n;i>0;i-=2)z*=i; return z; };
    f.sinc = x => Math.abs(x)<1e-12 ? 1 : Math.sin(x)/x;
    f.erf = x => erfApprox(x);
    f.erfc = x => 1-erfApprox(x);
    f.gamma = x => gammaApprox(x);
    f.mean = a => { const arr=Array.isArray(a)?a:[a]; return arr.reduce((s,v)=>s+v,0)/arr.length; };
    f.median = a => { const arr=(Array.isArray(a)?a:[a]).slice().sort((x,y)=>x-y); if(!arr.length)return NaN; const m=Math.floor(arr.length/2); return arr.length%2?arr[m]:(arr[m-1]+arr[m])/2; };
    f.mode = a => { const arr=Array.isArray(a)?a:[a], counts=new Map(); arr.forEach(v=>counts.set(v,(counts.get(v)||0)+1)); let best=null,bc=0; counts.forEach((c,v)=>{if(c>bc){bc=c;best=v}}); return best; };
    f.variance = a => { const arr=Array.isArray(a)?a:[a]; const m=f.mean(arr); return arr.reduce((s,v)=>s+(v-m)**2,0)/arr.length; };
    f.stddev = a => Math.sqrt(f.variance(a));
    f.sum = a => (Array.isArray(a)?a:[a]).reduce((s,v)=>s+v,0);

    math.import(f,{override:true});
    math.import({ phi: (1+Math.sqrt(5))/2, tau: 2*Math.PI },{override:true});
  },

  loadDemo(){
    this.state.expressions=[
      {id:uid(),text:"y = x^2 - 4*x + 3",visible:true,color:COLORS[0],label:"f(x)"},
      {id:uid(),text:"y = sin(x)",visible:true,color:COLORS[1],label:"g(x)"},
      {id:uid(),text:"y = 2*x + 1",visible:true,color:COLORS[2],label:"h(x)"}
    ];
    this.state.selected=this.state.expressions[0].id;
    this.pushHistory();
  },

  addExpression(text=""){
    const item={
      id:uid(),
      text,
      visible:true,
      color:COLORS[this.state.expressions.length%COLORS.length],
      label:"f"+(this.state.expressions.length+1)+"(x)"
    };
    this.state.expressions.push(item);
    this.state.selected=item.id;
    this.pushHistory();
    this.render();
    setTimeout(()=>{
      const el=document.querySelector(`input[data-id="${item.id}"]`);
      if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
    });
  },

  updateExpression(id,text){
    const e=this.state.expressions.find(x=>x.id===id);
    if(!e)return;
    e.text=text;
    this.pushHistoryDebounced();
    Graph.request();
  },

  deleteExpression(id){
    this.state.expressions=this.state.expressions.filter(e=>e.id!==id);
    if(this.state.selected===id)this.state.selected=this.state.expressions[0]?.id||null;
    this.pushHistory();
    this.render();
  },

  duplicateExpression(id){
    const e=this.state.expressions.find(x=>x.id===id);
    if(!e)return;
    const copy={...e,id:uid(),label:e.label+" copy"};
    this.state.expressions.push(copy);
    this.state.selected=copy.id;
    this.pushHistory();
    this.render();
  },

  toggleExpression(id){
    const e=this.state.expressions.find(x=>x.id===id);
    if(!e)return;
    e.visible=!e.visible;
    this.pushHistory();
    this.render();
  },

  render(){
    UI.renderExpressions();
    UI.renderLegend();
    Graph.request();
    document.getElementById("exprCount").textContent=this.state.expressions.length;
    
    const modePill = document.getElementById("modePill");
    if (modePill) {
      modePill.textContent=
        (this.state.mode[0].toUpperCase()+this.state.mode.slice(1))+" · "+
        (this.state.angleMode==="rad"?"Radians":"Degrees");
    }
  },

  pushHistory(){
    if(this.suppressHistory)return;
    this.history.push(JSON.stringify(this.state));
    if(this.history.length>60)this.history.shift();
    this.future=[];
  },
  pushHistoryDebounced(){
    clearTimeout(this._histTimer);
    this._histTimer=setTimeout(()=>this.pushHistory(),350);
  },
  undo(){
    if(this.history.length<2)return;
    const current=this.history.pop();
    this.future.push(current);
    this.suppressHistory=true;
    this.state=JSON.parse(this.history[this.history.length-1]);
    this.suppressHistory=false;
    this.render();
  },
  redo(){
    if(!this.future.length)return;
    const next=this.future.pop();
    this.history.push(next);
    this.suppressHistory=true;
    this.state=JSON.parse(next);
    this.suppressHistory=false;
    this.render();
  },

  /* ============================================================
     EXPORT  —  ask for X range / Y range, then render a PNG
     with a colour + label legend in the top-left corner.
     ============================================================ */

  showExportDialog(){
    const min = Graph.screenToWorld(0, Graph.height);
    const max = Graph.screenToWorld(Graph.width, 0);
    const r = v => Number(v.toFixed(3));

    UI.dialog("Export PNG", `
      <p style="margin:0 0 4px;color:var(--muted);font-size:13px">
        Enter the axis ranges you want printed in the exported image:
      </p>
      <div class="range-grid">
        <label class="range-field">X FROM<input id="expXmin" type="number" step="any" value="${r(min.x)}"></label>
        <label class="range-field">X TO<input id="expXmax" type="number" step="any" value="${r(max.x)}"></label>
        <label class="range-field">Y FROM<input id="expYmin" type="number" step="any" value="${r(min.y)}"></label>
        <label class="range-field">Y TO<input id="expYmax" type="number" step="any" value="${r(max.y)}"></label>
      </div>
      <div class="export-note">A legend with each curve's colour and label is drawn in the top-left corner of the PNG.</div>
      <div class="export-error" id="expErr"></div>
      <div class="dialog-actions">
        <button class="topbtn" style="background:var(--accent);color:#fff;border-color:var(--accent)"
                onclick="App.exportPNG()">Download PNG</button>
      </div>
    `);
  },

  exportPNG(){
    const val = id => {
      const el = document.getElementById(id);
      return el ? parseFloat(el.value) : NaN;
    };
    const xmin = val("expXmin"), xmax = val("expXmax");
    const ymin = val("expYmin"), ymax = val("expYmax");
    const errEl = document.getElementById("expErr");
    const fail = m => { if(errEl) errEl.textContent = m; else alert(m); };

    if(![xmin,xmax,ymin,ymax].every(Number.isFinite)) return fail("Please enter a number in every field.");
    if(xmax <= xmin) return fail("X FROM must be smaller than X TO.");
    if(ymax <= ymin) return fail("Y FROM must be smaller than Y TO.");
    if(errEl) errEl.textContent = "";

    /* ---- remember the live view so we can put it back ---- */
    const saved = {
      canvas: Graph.canvas, ctx: Graph.ctx,
      width : Graph.width,  height: Graph.height,
      scale : Graph.scale,  scaleY: Graph.scaleY,
      ox    : Graph.ox,     oy    : Graph.oy,
      trace : App.state.trace
    };

    /* ---- build an off-screen canvas with the same on-screen size ---- */
    const DPR = 2;
    const W = Math.max(320, Math.round(saved.width  || 1000));
    const H = Math.max(240, Math.round(saved.height || 700));

    const off  = document.createElement("canvas");
    off.width  = Math.round(W * DPR);
    off.height = Math.round(H * DPR);
    const octx = off.getContext("2d");
    octx.setTransform(DPR, 0, 0, DPR, 0, 0);

    /* ---- point the graph engine at the off-screen canvas and
            fit exactly the requested X / Y ranges ---- */
    Graph._exporting = true;
    Graph.canvas = off;
    Graph.ctx    = octx;
    Graph.width  = W;
    Graph.height = H;
    Graph.scale  = W / (xmax - xmin);   // px per unit in X
    Graph.scaleY = H / (ymax - ymin);   // px per unit in Y
    Graph.ox     = -xmin * Graph.scale; // xmin -> left edge
    Graph.oy     =  ymax * Graph.scaleY;// ymax -> top edge
    App.state.trace = false;            // never burn the trace dot into the PNG

    try { Graph.draw(); } catch(e) { console.error(e); }

    /* ---- legend: colour + label for every visible curve ---- */
    const items = App.state.expressions
      .filter(e => e.visible && e.text.trim())
      .map(e => ({ color: e.color, label: e.label, expr: e.text.trim() }));
    App.drawExportLegend(octx, W, H, items);

    /* ---- restore the live view ---- */
    Graph.canvas = saved.canvas; Graph.ctx    = saved.ctx;
    Graph.width  = saved.width;  Graph.height = saved.height;
    Graph.scale  = saved.scale;  Graph.scaleY = saved.scaleY;
    Graph.ox     = saved.ox;     Graph.oy     = saved.oy;
    Graph._exporting = false;
    App.state.trace  = saved.trace;
    Graph.request();

    /* ---- download ---- */
    const name = "ganith_x[" + safeFileName(xmin) + "_" + safeFileName(xmax) +
                 "]_y[" + safeFileName(ymin) + "_" + safeFileName(ymax) + "].png";
    const download = url => {
      const a = document.createElement("a");
      a.download = name;
      a.href = url;
      document.body.appendChild(a);
      a.click();
      a.remove();
    };

    if(off.toBlob){
      off.toBlob(blob => {
        if(!blob){ download(off.toDataURL("image/png")); return; }
        const url = URL.createObjectURL(blob);
        download(url);
        setTimeout(()=>URL.revokeObjectURL(url), 5000);
      }, "image/png");
    } else {
      download(off.toDataURL("image/png"));
    }

    document.getElementById("dialogBackdrop").classList.remove("show");
    UI.status("PNG exported · X [" + xmin + ", " + xmax + "] · Y [" + ymin + ", " + ymax + "]");
  },

  /* Draws ONLY colour + label into the exported PNG */
  drawExportLegend(ctx, W, H, items){
    if(!items.length) return;

    const padX = 13;
    const padY = 11;
    const rowH = 22;
    const swatch = 11;
    const gap = 9;

    const fontLabel = '600 13px Inter, "Segoe UI", Arial, sans-serif';

    /* Measure only the label */
    let contentW = 0;

    items.forEach(it => {
      ctx.font = fontLabel;
      const lw = ctx.measureText(it.label).width;
      contentW = Math.max(contentW, swatch + gap + lw);
    });

    const boxW = Math.min(contentW + padX * 2, W - 28);
    const boxH = items.length * rowH + padY * 2;
    const bx = 14;
    const by = 14;

    ctx.save();
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    /* Panel */
    ctx.fillStyle = "rgba(255,255,255,0.93)";
    ctx.strokeStyle = "#d5ddea";
    ctx.lineWidth = 1;
    roundRectPath(ctx, bx, by, boxW, boxH, 9);
    ctx.fill();
    ctx.stroke();

    items.forEach((it, i) => {
      const cy = by + padY + i * rowH + rowH / 2;

      /* Colour dot */
      ctx.fillStyle = it.color;
      ctx.beginPath();
      ctx.arc(
        bx + padX + swatch / 2,
        cy,
        swatch / 2,
        0,
        Math.PI * 2
      );
      ctx.fill();

      /* Label ONLY — equation is intentionally not drawn */
      const tx = bx + padX + swatch + gap;
      ctx.font = fontLabel;
      ctx.fillStyle = "#182235";
      ctx.fillText(it.label, tx, cy);
    });

    ctx.restore();
  },

  exportPNGLegacy(){ /* kept for backwards compatibility */
    this.showExportDialog();
  }
};

const FunctionLibrary={
  toggle(button){
    const group=button.closest(".function-group");
    if(!group)return;
    group.classList.toggle("open");
    const span=group.querySelector("span");
    if(span){
      const label=span.textContent.replace(/^▸|^▾/,"").trim();
      span.textContent=(group.classList.contains("open")?"▾ ":"▸ ")+label;
    }
  },
  toggleAll(){
    const groups=[...document.querySelectorAll(".function-group")];
    const open=groups.some(g=>!g.classList.contains("open"));
    groups.forEach(g=>{
      g.classList.toggle("open",open);
      const span=g.querySelector("span");
      if(span){
        const label=span.textContent.replace(/^▸|^▾/,"").trim();
        span.textContent=(open?"▾ ":"▸ ")+label;
      }
    });
  },
  insert(value){
    let input=document.querySelector(".expr-input:focus");
    if(!input){
      const idx=App.state.expressions.findIndex(e=>e.id===App.state.selected);
      input=document.querySelectorAll(".expr-input")[idx]||document.querySelector(".expr-input:last-of-type");
    }
    if(!input){
      App.addExpression(value);
      return;
    }
    const start=input.selectionStart ?? input.value.length;
    const end=input.selectionEnd ?? input.value.length;
    const before=input.value.slice(0,start);
    const after=input.value.slice(end);
    let insertion=value;
    const constants=["pi","e","phi","tau","Infinity","alpha","beta","gammaVar","delta","theta","lambda","mu","sigma","omega"];
    if(constants.includes(value) && /[0-9A-Za-z_)πφτ]$/.test(before)){
      insertion="*"+value;
    }
    input.value=before+insertion+after;
    input.dispatchEvent(new Event("input",{bubbles:true}));
    input.focus();
    const pos=start+insertion.length;
    input.setSelectionRange(pos,pos);
    const id=input.dataset.id;
    App.state.selected=id;
    Graph.request();
  }
};

const UI={
  renderExpressions(){
    const list=document.getElementById("expressionList");
    list.innerHTML="";
    App.state.expressions.forEach(e=>{
      const card=document.createElement("div");
      card.className="expr-card"+(e.id===App.state.selected?" selected":"");
      card.dataset.id=e.id;
      card.innerHTML=`
        <div class="expr-row">
          <button class="icon-btn visibility" title="Show/hide">${e.visible?"●":"○"}</button>
          <span class="color-dot" style="background:${e.color}"></span>
          <input class="expr-input" data-id="${e.id}" value="">
          <button class="icon-btn duplicate" title="Duplicate">⧉</button>
          <button class="icon-btn delete" title="Delete">×</button>
        </div>
        <div class="expr-tools">
          <button class="mini label-btn">Label: ${e.label}</button>
          <button class="mini parameter-btn">Parameters</button>
        </div>
      `;
      const input=card.querySelector(".expr-input");
      input.value=e.text;

      input.addEventListener("focus",()=>{
        App.state.selected=e.id;
        document.querySelectorAll(".expr-card").forEach(c=>c.classList.remove("selected"));
        card.classList.add("selected");
      });
      input.addEventListener("input",ev=>App.updateExpression(e.id,ev.target.value));

      input.addEventListener("keydown",ev=>{
        if(ev.key!=="Backspace") return;
        const s=input.selectionStart, epos=input.selectionEnd;
        if(s!==epos) return;
        if(s===0) return;
        const val=input.value;
        const before=val.slice(0,s);

        for(const fn of FUNCTION_TOKENS){
          const token=fn+"(";
          if(before.endsWith(token)){
            ev.preventDefault();
            const newVal=val.slice(0,s-token.length)+val.slice(s);
            input.value=newVal;
            const pos=s-token.length;
            input.setSelectionRange(pos,pos);
            App.updateExpression(e.id,newVal);
            return;
          }
        }
        if(before.endsWith("(")){
          const m=before.slice(0,-1).match(/[A-Za-z_]\w*$/);
          if(!m){
            ev.preventDefault();
            const newVal=val.slice(0,s-1)+val.slice(s);
            input.value=newVal;
            const pos=s-1;
            input.setSelectionRange(pos,pos);
            App.updateExpression(e.id,newVal);
          }
        }
      });

      card.querySelector(".visibility").onclick=()=>App.toggleExpression(e.id);
      card.querySelector(".delete").onclick=()=>App.deleteExpression(e.id);
      card.querySelector(".duplicate").onclick=()=>App.duplicateExpression(e.id);
      card.querySelector(".label-btn").onclick=()=>{
        const label=prompt("Function label:",e.label);
        if(label!==null){e.label=label;App.pushHistory();App.render()}
      };
      card.querySelector(".parameter-btn").onclick=()=>{ UI.showParameters(e); };

      card.addEventListener("click",ev=>{
        if(ev.target.closest("button") || ev.target===input) return;
        App.state.selected=e.id;
        document.querySelectorAll(".expr-card").forEach(c=>c.classList.remove("selected"));
        card.classList.add("selected");
        input.focus();
      });

      list.appendChild(card);
    });
  },

  renderLegend() {
    const legendEl = document.getElementById("legend");
    if (!legendEl) return;
    legendEl.innerHTML = "";
    
    App.state.expressions.forEach(e => {
      if (!e.visible || !e.text.trim()) return;
      
      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `
        <span class="legend-color" style="background:${e.color}"></span>
        <span>${e.label}</span>
      `;
      legendEl.appendChild(item);
    });
  },

  showParameters(e){
    const vars=detectVariables(e.text);
    const body=vars.length
      ? `<p>Detected parameters/variables:</p><pre>${vars.join(", ")}</pre>`
      : "<p>No independent parameters were detected.</p>";
    this.dialog("Parameters",body);
  },

  dialog(title,body){
    document.getElementById("dialogTitle").textContent=title;
    document.getElementById("dialogBody").innerHTML=body;
    document.getElementById("dialogBackdrop").classList.add("show");
  },

  status(msg){
    document.getElementById("status").textContent=msg;
    clearTimeout(this._statusTimer);
    this._statusTimer=setTimeout(()=>document.getElementById("status").textContent="Ready",2500);
  },

  bind(){
    document.getElementById("addExpressionBtn").onclick=()=>App.addExpression();
    document.getElementById("expandFunctions").onclick=()=>FunctionLibrary.toggleAll();
    document.getElementById("newBtn").onclick=()=>App.newProject();
    // Removed saveBtn and loadBtn bindings
    document.getElementById("undoBtn").onclick=()=>App.undo();
    document.getElementById("redoBtn").onclick=()=>App.redo();

    /* Export now opens the range dialog */
    document.getElementById("exportBtn").onclick=()=>App.showExportDialog();

    document.getElementById("resetBtn").onclick=()=>Graph.reset();
    document.getElementById("fitBtn").onclick=()=>Graph.fitAll();
    document.getElementById("originBtn").onclick=()=>Graph.origin();
    document.getElementById("traceBtn").onclick=()=>{
      App.state.trace=!App.state.trace;
      document.getElementById("traceBtn").classList.toggle("active",App.state.trace);
      Graph.request();
    };
    document.getElementById("animateBtn").onclick=()=>{
      App.state.animating=!App.state.animating;
      document.getElementById("animateBtn").textContent=App.state.animating?"❚❚ Animation":"▶ Animation";
      if(App.state.animating) Graph.animate();
    };
    document.getElementById("angleBtn").onclick=()=>{
      App.state.angleMode=App.state.angleMode==="rad"?"deg":"rad";
      App.render();
    };
    document.getElementById("modeSelect").onchange=e=>{
      App.state.mode=e.target.value;
      App.render();
    };
    document.getElementById("sidebarBtn").onclick=()=>{
      document.getElementById("sidebar").classList.toggle("open");
    };
    document.getElementById("dialogClose").onclick=()=>document.getElementById("dialogBackdrop").classList.remove("show");
    document.getElementById("dialogBackdrop").onclick=e=>{
      if(e.target.id==="dialogBackdrop")e.currentTarget.classList.remove("show");
    };
    document.getElementById("settingsBtn").onclick=()=>UI.dialog(
      "GANITH Settings",
      `<p><b>Graph engine:</b> Canvas</p>
       <p><b>Expression parser:</b> Math.js safe parser</p>
       <p><b>Angle mode:</b> ${App.state.angleMode==="rad"?"Radians":"Degrees"}</p>
       <p><b>Project storage:</b> Browser localStorage</p>`
    );
    document.getElementById("toolsBtn").onclick=()=>UI.dialog(
      "Tools",
      `<p>Use the bottom controls for Reset View, Fit All, Origin, Trace and Animation.</p>
       <p>Use <b>Export</b> to save a PNG for a specific X / Y range with a colour legend.</p>`
    );
  }
};

const Graph={
  canvas:null,ctx:null,width:0,height:0,scale:50,scaleY:50,ox:0,oy:0,
  dragging:false,lastX:0,lastY:0,pointerX:0,pointerY:0,raf:0,
  _compiledCache:new Map(),
  _exporting:false,

  init(){
    this.canvas=document.getElementById("graph");
    this.ctx=this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize",()=>this.resize());
    this.canvas.addEventListener("wheel",e=>this.wheel(e),{passive:false});
    this.canvas.addEventListener("pointerdown",e=>this.down(e));
    window.addEventListener("pointermove",e=>this.move(e));
    window.addEventListener("pointerup",()=>this.up());
    this.canvas.addEventListener("dblclick",e=>this.doubleClick(e));
    this.canvas.addEventListener("pointerleave",()=>{
      document.getElementById("coords").textContent="X: — Y: —";
    });
    if(typeof ResizeObserver!=="undefined"){
      new ResizeObserver(()=>this.resize()).observe(this.canvas.parentElement);
    }
  },

  resize(){
    const r=this.canvas.getBoundingClientRect();
    if(r.width<10 || r.height<10) return;
    const dpr=Math.max(1,Math.min(2,devicePixelRatio||1));
    this.width=r.width;this.height=r.height;
    this.canvas.width=Math.round(r.width*dpr);
    this.canvas.height=Math.round(r.height*dpr);
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!this._originSet){ this.ox=r.width/2; this.oy=r.height/2; this._originSet=true; }
    this.request();
  },

  origin(){
    this.ox=this.width/2;
    this.oy=this.height/2;
    this._originSet=true;
    this.request();
  },

  reset(){ this.scale=50; this.scaleY=50; this.origin(); },

  request(){
    if(this._exporting) return;
    cancelAnimationFrame(this.raf);
    this.raf=requestAnimationFrame(()=>this.draw());
  },

  /* independent X / Y scaling so an exported PNG can match
     exactly the X-range and Y-range the user asked for */
  worldToScreen(x,y){ return {x:this.ox+x*this.scale,y:this.oy-y*this.scaleY}; },
  screenToWorld(px,py){ return {x:(px-this.ox)/this.scale,y:(this.oy-py)/this.scaleY}; },

  wheel(e){
    e.preventDefault();
    const rect=this.canvas.getBoundingClientRect();
    const px=e.clientX-rect.left,py=e.clientY-rect.top;
    const before=this.screenToWorld(px,py);
    const factor=Math.exp(-e.deltaY*.0012);
    this.scale =Math.max(2,Math.min(1000,this.scale *factor));
    this.scaleY=Math.max(2,Math.min(1000,this.scaleY*factor));
    const after=this.screenToWorld(px,py);
    this.ox+=(after.x-before.x)*this.scale;
    this.oy-=(after.y-before.y)*this.scaleY;
    this.request();
  },

  down(e){ this.dragging=true; this.lastX=e.clientX; this.lastY=e.clientY; this.canvas.setPointerCapture?.(e.pointerId); },

  move(e){
    const rect=this.canvas.getBoundingClientRect();
    const px=e.clientX-rect.left,py=e.clientY-rect.top;
    const w=this.screenToWorld(px,py);
    document.getElementById("coords").textContent=`X: ${w.x.toFixed(3)} Y: ${w.y.toFixed(3)}`;
    if(!this.dragging)return;
    const dx=e.clientX-this.lastX,dy=e.clientY-this.lastY;
    this.ox+=dx;this.oy+=dy;
    this.lastX=e.clientX;this.lastY=e.clientY;
    this.request();
  },

  up(){this.dragging=false},

  doubleClick(e){
    const rect=this.canvas.getBoundingClientRect();
    const px=e.clientX-rect.left,py=e.clientY-rect.top;
    const before=this.screenToWorld(px,py);
    this.scale =Math.min(1000,this.scale *1.5);
    this.scaleY=Math.min(1000,this.scaleY*1.5);
    const after=this.screenToWorld(px,py);
    this.ox+=(after.x-before.x)*this.scale;
    this.oy-=(after.y-before.y)*this.scaleY;
    this.request();
  },

  fitAll(){ this.reset(); },

  draw(){
    const ctx=this.ctx,w=this.width,h=this.height;
    if(w<10||h<10) return;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle="#fbfcfe";
    ctx.fillRect(0,0,w,h);
    this.drawGrid();
    this.drawAxes();
    if(App.state.mode==="cartesian") this.drawCartesian();
    else if(App.state.mode==="polar") this.drawPolar();
    else if(App.state.mode==="parametric") this.drawParametric();
    else if(App.state.mode==="implicit") this.drawImplicit();
    this.drawObjects();
    if(App.state.trace)this.drawTrace();
    
    const modePill = document.getElementById("modePill");
    if (modePill) {
      modePill.textContent=
        App.state.mode[0].toUpperCase()+App.state.mode.slice(1)+" · "+
        (App.state.angleMode==="rad"?"Radians":"Degrees");
    }
  },

  drawGrid(){
    const ctx=this.ctx,w=this.width,h=this.height;
    const stepX=this.gridStep(this.scale);
    const stepY=this.gridStep(this.scaleY);
    const min=this.screenToWorld(0,h);
    const max=this.screenToWorld(w,0);
    ctx.lineWidth=1;
    ctx.strokeStyle="#e1e7f0";
    ctx.beginPath();
    for(let x=Math.floor(min.x/stepX)*stepX;x<=max.x;x+=stepX){
      const p=this.worldToScreen(x,0);
      ctx.moveTo(Math.round(p.x)+.5,0);
      ctx.lineTo(Math.round(p.x)+.5,h);
    }
    for(let y=Math.floor(min.y/stepY)*stepY;y<=max.y;y+=stepY){
      const p=this.worldToScreen(0,y);
      ctx.moveTo(0,Math.round(p.y)+.5);
      ctx.lineTo(w,Math.round(p.y)+.5);
    }
    ctx.stroke();
    ctx.fillStyle="#738198";
    ctx.font="11px Segoe UI";
    for(let x=Math.floor(min.x/stepX)*stepX;x<=max.x;x+=stepX){
      if(Math.abs(x)<stepX*.01)continue;
      const p=this.worldToScreen(x,0);
      if(p.x>4&&p.x<w-20)ctx.fillText(formatTick(x),p.x+3,Math.min(h-5,Math.max(12,p.y+14)));
    }
    for(let y=Math.floor(min.y/stepY)*stepY;y<=max.y;y+=stepY){
      if(Math.abs(y)<stepY*.01)continue;
      const p=this.worldToScreen(0,y);
      if(p.y>12&&p.y<h-5)ctx.fillText(formatTick(y),p.x+7,p.y-3);
    }
  },

  gridStep(scale){
    const s = scale || this.scale || 50;
    const raw=70/s;
    const p=Math.pow(10,Math.floor(Math.log10(raw)));
    const n=raw/p;
    return (n<1.5?1:n<3?2:n<7?5:10)*p;
  },

  drawAxes(){
    const ctx=this.ctx,w=this.width,h=this.height;
    ctx.strokeStyle="#7a879b";ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(0,this.oy+.5);ctx.lineTo(w,this.oy+.5);
    ctx.moveTo(this.ox+.5,0);ctx.lineTo(this.ox+.5,h);
    ctx.stroke();
    ctx.fillStyle="#66758d";
    ctx.font="12px Segoe UI";
    if(this.ox>5&&this.ox<w-15)ctx.fillText("y",this.ox+7,15);
    if(this.oy>15&&this.oy<h-5)ctx.fillText("x",w-15,this.oy-7);
  },

  getCompiled(exprStr){
    if(this._compiledCache.has(exprStr)){
      return this._compiledCache.get(exprStr);
    }
    let compiled = null;
    try{
      compiled = math.compile(exprStr);
    }catch(e){ compiled = null; }
    this._compiledCache.set(exprStr, compiled);
    return compiled;
  },

  evalExpr(expr, scope){
    const compiled = this.getCompiled(expr);
    if(!compiled) return NaN;
    try{
      return Number(compiled.evaluate({
        ...scope,
        t: App.state.t,
        pi: Math.PI,
        e: Math.E,
        phi: (1+Math.sqrt(5))/2,
        tau: 2*Math.PI
      }));
    }catch{ return NaN; }
  },

  containsVar(expr, v){
    const re = new RegExp(`(^|[^A-Za-z0-9_])${v}([^A-Za-z0-9_]|$)`);
    return re.test(expr);
  },

  classifyExpression(text){
    const s = text.trim();
    if(!s) return { type: "empty" };
    if(!s.includes("=")) return { type: "y-of-x", expr: s };

    const parts = s.split("=");
    if(parts.length !== 2) return { type: "invalid" };
    const left  = parts[0].trim();
    const right = parts[1].trim();

    const yLike = v => v === "y" || /^[fgh]\s*\(\s*x\s*\)$/.test(v);
    const xLike = v => v === "x";

    if(yLike(left) && !this.containsVar(right, "y")) return { type: "y-of-x", expr: right };
    if(yLike(right) && !this.containsVar(left, "y")) return { type: "y-of-x", expr: left };
    if(xLike(left) && !this.containsVar(right, "x")) return { type: "x-of-y", expr: right };
    if(xLike(right) && !this.containsVar(left, "x")) return { type: "x-of-y", expr: left };

    return { type: "implicit", lhs: left, rhs: right };
  },

  drawCartesian(){
    const w=this.width, h=this.height;
    const min=this.screenToWorld(0,h), max=this.screenToWorld(w,0);
    App.state.expressions.forEach(e=>{
      if(!e.visible) return;
      if(!e.text.trim()) return;

      const cls = this.classifyExpression(e.text);
      if(cls.type === "y-of-x") this.plotYofX(e, cls.expr, min, max);
      else if(cls.type === "x-of-y") this.plotXofY(e, cls.expr, min, max);
      else if(cls.type === "implicit") this.plotImplicit(e, cls.lhs, cls.rhs);
    });
  },

  plotYofX(e, expr, min, max){
    const ctx=this.ctx;
    ctx.strokeStyle=e.color; ctx.lineWidth=2.4; ctx.beginPath();
    let started=false, lastY=null;
    const samples = Math.min(5000, Math.max(1000, Math.floor(this.width*2)));
    for(let i=0;i<=samples;i++){
      const x = min.x + (max.x-min.x)*i/samples;
      const y = this.evalExpr(expr, {x});
      const valid = Number.isFinite(y) && Math.abs(y) < 1e7;
      if(!valid){ started=false; lastY=null; continue; }
      const p = this.worldToScreen(x, y);
      if(lastY !== null && Math.abs(y-lastY) > Math.max(10, Math.abs(max.y-min.y)*2)){
        started = false;
      }
      if(!started){ ctx.moveTo(p.x,p.y); started=true; }
      else ctx.lineTo(p.x,p.y);
      lastY = y;
    }
    ctx.stroke();
  },

  plotXofY(e, expr, min, max){
    const ctx=this.ctx;
    ctx.strokeStyle=e.color; ctx.lineWidth=2.4; ctx.beginPath();
    let started=false, lastX=null;
    const samples = Math.min(5000, Math.max(1000, Math.floor(this.height*2)));
    for(let i=0;i<=samples;i++){
      const y = min.y + (max.y-min.y)*i/samples;
      const x = this.evalExpr(expr, {y});
      const valid = Number.isFinite(x) && Math.abs(x) < 1e7;
      if(!valid){ started=false; lastX=null; continue; }
      const p = this.worldToScreen(x, y);
      if(lastX !== null && Math.abs(x-lastX) > Math.max(10, Math.abs(max.x-min.x)*2)){
        started = false;
      }
      if(!started){ ctx.moveTo(p.x,p.y); started=true; }
      else ctx.lineTo(p.x,p.y);
      lastX = x;
    }
    ctx.stroke();
  },

  plotImplicit(e, lhs, rhs){
    const fullExpr = `(${lhs})-(${rhs})`;
    const compiled = this.getCompiled(fullExpr);
    if(!compiled) return;

    const F = (x,y) => {
      try{
        return Number(compiled.evaluate({
          x, y,
          pi: Math.PI, e: Math.E,
          phi: (1+Math.sqrt(5))/2, tau: 2*Math.PI,
          t: App.state.t
        }));
      }catch{ return NaN; }
    };

    const PX_PER_CELL = 4;
    const step = Math.max(0.001, PX_PER_CELL / this.scale);

    const min = this.screenToWorld(0, this.height);
    const max = this.screenToWorld(this.width, 0);

    const ctx = this.ctx;
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    const startX = Math.floor(min.x/step)*step;
    const startY = Math.floor(min.y/step)*step;

    const maxCells = 1000 * 1000; 
    const cellsX = Math.floor((max.x - startX) / step);
    const cellsY = Math.floor((max.y - startY) / step);
    if(cellsX * cellsY > maxCells){
      ctx.lineCap = "butt";
      return;
    }

    let firstPoint = null;

    for(let x = startX; x < max.x; x += step){
      for(let y = startY; y < max.y; y += step){
        const a = F(x, y);
        const b = F(x+step, y);
        const c = F(x+step, y+step);
        const d = F(x, y+step);
        if(!Number.isFinite(a) || !Number.isFinite(b) ||
           !Number.isFinite(c) || !Number.isFinite(d)) continue;

        const pts = [];
        if((a>=0) !== (b>=0)) pts.push(interpolate(x,     y,     x+step, y,      a, b));
        if((b>=0) !== (c>=0)) pts.push(interpolate(x+step,y,     x+step, y+step, b, c));
        if((c>=0) !== (d>=0)) pts.push(interpolate(x+step,y+step,x,      y+step, c, d));
        if((d>=0) !== (a>=0)) pts.push(interpolate(x,     y+step,x,      y,      d, a));

        if(pts.length >= 2){
          const p1 = this.worldToScreen(pts[0].x, pts[0].y);
          const p2 = this.worldToScreen(pts[1].x, pts[1].y);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
          if(!firstPoint) firstPoint = pts[0];
        }
      }
    }

    ctx.lineCap = "butt";
    ctx.lineJoin = "miter";
  },

  drawPolar(){
    const ctx=this.ctx,w=this.width,h=this.height;
    const cx=this.ox,cy=this.oy;
    ctx.save();
    ctx.strokeStyle="#dce4ef";ctx.lineWidth=1;
    const maxR=Math.max(w,h);
    const ratio=this.scaleY/this.scale;
    for(let r=this.gridStep()*this.scale;r<maxR;r+=this.gridStep()*this.scale){
      ctx.beginPath();ctx.ellipse(cx,cy,r,r*ratio,0,0,Math.PI*2);ctx.stroke();
    }
    for(let a=0;a<Math.PI*2;a+=Math.PI/12){
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.lineTo(cx+maxR*Math.cos(a)*this.scale/this.scale,
                 cy-maxR*Math.sin(a)*this.scaleY/this.scale);
      ctx.stroke();
    }
    ctx.restore();
    App.state.expressions.forEach(e=>{
      if(!e.visible)return;
      if(!e.text.trim())return;
      ctx.strokeStyle=e.color;ctx.lineWidth=2.4;ctx.beginPath();
      let started=false;
      const expr = e.text.replace(/^r\s*=/i,"");
      for(let i=0;i<=1800;i++){
        const th=-Math.PI*4+Math.PI*8*i/1800;
        const r=this.evalExpr(expr, {theta: th, t: th, x: th});
        if(!Number.isFinite(r)){started=false;continue}
        const p=this.worldToScreen(r*Math.cos(th),r*Math.sin(th));
        if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y);
      }
      ctx.stroke();
    });
  },

  drawParametric(){
    App.state.expressions.forEach(e=>{
      if(!e.visible)return;
      if(!e.text.trim())return;
      const m=e.text.match(/x\s*\((?:t|θ)\)\s*=\s*(.*?)\s*y\s*\((?:t|θ)\)\s*=\s*(.*)/i);
      if(!m)return;
      const fx=m[1],fy=m[2];
      this.ctx.strokeStyle=e.color;this.ctx.lineWidth=2.4;this.ctx.beginPath();
      let started=false;
      for(let i=0;i<=1600;i++){
        const t=-10+20*i/1600;
        const x=this.evalExpr(fx,{t});
        const y=this.evalExpr(fy,{t});
        if(!Number.isFinite(x)||!Number.isFinite(y)){started=false;continue}
        const p=this.worldToScreen(x,y);
        if(!started){this.ctx.moveTo(p.x,p.y);started=true}else this.ctx.lineTo(p.x,p.y);
      }
      this.ctx.stroke();
    });
  },

  drawImplicit(){
    App.state.expressions.forEach(e=>{
      if(!e.visible)return;
      if(!e.text.trim())return;
      if(!e.text.includes("="))return;
      const parts = e.text.split("=");
      if(parts.length!==2)return;
      this.plotImplicit(e, parts[0].trim(), parts[1].trim());
    });
  },

  drawObjects(){
    const ctx=this.ctx;
    App.state.points.forEach(p=>{
      const q=this.worldToScreen(p.x,p.y);
      ctx.fillStyle="#111827";ctx.beginPath();ctx.arc(q.x,q.y,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#111827";ctx.font="12px Segoe UI";ctx.fillText(p.label,q.x+8,q.y-8);
    });
    App.state.segments.forEach(s=>{
      const a=this.worldToScreen(s.a.x,s.a.y),b=this.worldToScreen(s.b.x,s.b.y);
      ctx.strokeStyle="#7b3fe4";ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    });
    App.state.circles.forEach(c=>{
      const q=this.worldToScreen(c.x,c.y);
      ctx.strokeStyle="#e67e22";ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.ellipse(q.x,q.y,c.r*this.scale,c.r*this.scaleY,0,0,Math.PI*2);
      ctx.stroke();
      ctx.fillStyle="#e67e22";ctx.beginPath();ctx.arc(q.x,q.y,4,0,Math.PI*2);ctx.fill();
    });
  },

  drawTrace(){
    const e=App.state.expressions.find(x=>x.id===App.state.selected && x.visible);
    if(!e||!e.text.trim())return;
    const cls = this.classifyExpression(e.text);
    if(cls.type !== "y-of-x") return;
    const mouse=this.screenToWorld(this.pointerX||this.width/2,this.pointerY||this.height/2);
    const y=this.evalExpr(cls.expr, {x: mouse.x});
    if(!Number.isFinite(y))return;
    const p=this.worldToScreen(mouse.x,y);
    const ctx=this.ctx;
    ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=e.color;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(p.x,this.oy);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.setLineDash([]);
  },

  animate(){
    if(!App.state.animating)return;
    if(this._exporting){ requestAnimationFrame(()=>this.animate()); return; }
    App.state.t+=0.03;
    this.request();
    requestAnimationFrame(()=>this.animate());
  }
};

function interpolate(x1,y1,x2,y2,f1,f2){
  const t=f1/(f1-f2);
  return {x:x1+(x2-x1)*t,y:y1+(y2-y1)*t};
}
function formatTick(v){
  if(Math.abs(v)>=1000)return v.toExponential(1);
  if(Math.abs(v)<.001 && v!==0)return v.toExponential(1);
  return Number(v.toFixed(4)).toString();
}
function safeFileName(v){
  return String(v).replace(/[^0-9a-zA-Z._-]/g,"");
}
function roundRectPath(ctx,x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function detectVariables(text){
  const reserved=new Set([
    "sin","cos","tan","sec","csc","cot","asin","acos","atan",
    "asec","acsc","acot","sinh","cosh","tanh","sech","csch","coth",
    "asinh","acosh","atanh","asech","acsch","acoth","ln","log","log10",
    "log2","logb","exp","sqrt","cbrt","pow","abs","sign","floor","ceil",
    "round","trunc","frac","min","max","clamp","hypot","factorial","gcd",
    "lcm","mod","isPrime","nPr","nCr","doubleFactorial","sinc","erf",
    "erfc","gamma","mean","median","mode","variance","stddev","sum",
    "pi","e","phi","tau","Infinity","x","y","t"
  ]);
  return [...new Set((text.match(/[A-Za-z_]\w*/g)||[]).filter(x=>!reserved.has(x)))];
}
function erfApprox(x){
  const sign=x<0?-1:1;x=Math.abs(x);
  const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;
  const t=1/(1+p*x);
  const y=1-(((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t)*Math.exp(-x*x);
  return sign*y;
}
function gammaApprox(z){
  const p=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z<.5)return Math.PI/(Math.sin(Math.PI*z)*gammaApprox(1-z));
  z-=1;let x=.99999999999980993;
  for(let i=0;i<p.length;i++)x+=p[i]/(z+i+1);
  const t=z+p.length-.5;
  return Math.sqrt(2*Math.PI)*Math.pow(t,z+.5)*Math.exp(-t)*x;
}

document.getElementById("graph").addEventListener("pointermove",e=>{
  const r=Graph.canvas.getBoundingClientRect();
  Graph.pointerX=e.clientX-r.left;
  Graph.pointerY=e.clientY-r.top;
  if(App.state.trace)Graph.request();
});

document.addEventListener("keydown",e=>{
  const inInput = e.target && e.target.classList && e.target.classList.contains("expr-input");
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){
    if(inInput) return;
    e.preventDefault();e.shiftKey?App.redo():App.undo();
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){
    if(inInput) return;
    e.preventDefault();App.redo();
  }
  if(e.key==="Escape"){ document.getElementById("dialogBackdrop").classList.remove("show"); }
});

window.addEventListener("load",()=>App.init());
</script>
