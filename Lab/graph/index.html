<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GANITH — Advanced Mathematical Graphing &amp; Visualization</title>
<script src="https://cdn.jsdelivr.net/npm/mathjs@14.0.1/lib/browser/math.js"></script>
<style>
:root{
  --bg:#f7f9fc;--panel:#ffffff;--panel2:#f3f6fa;--border:#d5ddea;
  --text:#182235;--muted:#72809a;--accent:#2f6fed;--accent2:#4f46e5;
  --grid:#dce4ef;--axis:#6b7890;--danger:#dc3545;--ok:#169c6b;
  --shadow:0 2px 10px rgba(24,34,53,.08);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:54px 1fr 48px}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--border);z-index:10}
.brand{display:flex;align-items:center;gap:10px;margin-right:4px}
.logo{width:44px;height:44px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}
.brand-title{font-size:18px;font-weight:850;letter-spacing:.5px;line-height:1}
.brand-sub{font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:.25px}
.topbtn{height:38px;padding:0 13px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-weight:600;white-space:nowrap}
.topbtn:hover{background:var(--panel2)}
.top-spacer{flex:1}
select.top-select{height:38px;border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:0 12px;color:var(--text);min-width:0}
.main{min-height:0;display:grid;grid-template-columns:360px 1fr;transition:grid-template-columns 0.3s ease}
.main.collapsed{grid-template-columns:0 1fr}
.main.collapsed .sidebar{overflow:hidden;opacity:0;pointer-events:none}
.sidebar{min-width:0;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);overflow:hidden}
.section-head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--border);font-weight:800;font-size:12px;letter-spacing:.6px}
.section-head-right{display:flex;align-items:center;gap:8px}
.sidebar-close{display:block;background:transparent;border:0;color:var(--muted);font-size:22px;cursor:pointer;padding:0 5px;line-height:1;border-radius:5px}
.sidebar-close:hover{background:var(--panel2);color:var(--danger)}
.expr-list{overflow:auto;flex:1;padding:8px 8px 0}
.expr-card{
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px;
  margin-bottom:8px;
  background:var(--panel);
  box-shadow:0 1px 3px rgba(0,0,0,.03);
  position:relative;
}
.expr-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px rgba(47,111,237,.12)}
.expr-card.has-error{border-color:var(--danger);box-shadow:0 0 0 1px rgba(220,53,69,.12)}
.expr-card.has-error .expr-input{color:var(--danger)}
.expr-row{display:flex;align-items:center;gap:7px}
.color-dot{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--border);flex:none}
.expr-input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-family:"Cambria Math",Georgia,serif;font-size:16px}
.icon-btn{border:0;background:transparent;color:var(--muted);padding:4px;border-radius:5px}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.expr-tools{display:flex;gap:5px;margin:7px 0 0 27px;flex-wrap:wrap;align-items:center}
.expr-meta{display:flex;gap:6px;align-items:center;margin:6px 0 0 27px;flex-wrap:wrap}
.expr-type-badge{font-size:9px;font-weight:900;letter-spacing:.5px;padding:2px 7px;border-radius:4px;background:#e8eefc;color:var(--accent);text-transform:uppercase;white-space:nowrap}
.expr-type-badge.ok{background:#e6f6ef;color:var(--ok)}
.expr-error-text{font-size:10px;color:var(--danger);font-weight:600}
.mini{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:6px;padding:4px 8px;font-size:11px}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.add-row{display:grid;grid-template-columns:1fr;gap:7px;padding:8px;border-top:1px solid var(--border)}
.add-row button{height:44px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-weight:600}
.add-row button.primary{background:var(--accent);color:white;border-color:var(--accent);font-size:15px}
.add-row button.primary:hover{background:#2558c8}
.function-library{border-top:1px solid var(--border);background:var(--panel);max-height:365px;overflow-y:auto;flex:none;transition:max-height 0.2s ease}
.function-library.collapsed{max-height:38px;overflow:hidden}
.function-library-header{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;border-bottom:1px solid var(--border);font-size:10px;font-weight:900;letter-spacing:1px;position:sticky;top:0;background:var(--panel);z-index:2}
.small-btn{border:1px solid var(--border);background:var(--panel2);border-radius:6px;padding:4px 7px;font-size:10px;color:var(--text)}
.function-library-body{display:flex;flex-direction:column}
.function-group{border-bottom:1px solid var(--border)}
.function-group-title{width:100%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:space-between;padding:8px 9px;cursor:pointer;font-size:11px;font-weight:700;text-align:left}
.function-group-title:hover{background:var(--panel2)}
.function-group-title small{color:var(--muted);font-size:9px;font-weight:400}
.function-buttons{display:none;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 7px 7px}
.function-group.open .function-buttons{display:grid}
.function-group.open .function-group-title span{color:var(--accent)}
.function-buttons button{min-height:29px;padding:4px 3px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);cursor:pointer;font-family:"Cambria Math",Georgia,serif;font-size:12px}
.function-buttons button:hover{background:var(--accent);color:white;border-color:var(--accent);transform:translateY(-1px)}
.canvas-wrap{position:relative;min-width:0;min-height:0;background:#fff}
#graph{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint,.mode-pill,.coords{position:absolute;top:14px;padding:8px 11px;border:1px solid var(--border);background:rgba(255,255,255,.93);border-radius:9px;box-shadow:var(--shadow);font-size:12px;color:var(--muted);pointer-events:none}
.hint{left:14px}.mode-pill{left:50%;transform:translateX(-50%)}.coords{right:14px;font-variant-numeric:tabular-nums}
.status{position:absolute;left:14px;bottom:14px;padding:7px 10px;background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--muted);pointer-events:none;max-width:60%}
.bottom{display:flex;align-items:center;gap:7px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--border);z-index:10;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.bottom::-webkit-scrollbar{display:none}
.toolbtn{height:34px;padding:0 11px;border:1px solid var(--border);background:var(--panel);border-radius:8px;color:var(--text);font-size:12px;flex-shrink:0}
.toolbtn:hover,.toolbtn.active{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.bottom-spacer{flex:1}
.precision{font-size:11px;color:var(--muted);flex-shrink:0}
.dialog-backdrop{display:none;position:fixed;inset:0;background:rgba(10,18,32,.35);z-index:50;align-items:center;justify-content:center}
.dialog-backdrop.show{display:flex}
.dialog{width:min(620px,92vw);max-height:82vh;overflow:auto;background:var(--panel);border-radius:14px;box-shadow:0 20px 70px rgba(0,0,0,.25);border:1px solid var(--border);padding:18px}
.dialog h2{margin:0 0 12px;font-size:18px}
.dialog pre{white-space:pre-wrap;background:var(--panel2);padding:12px;border-radius:8px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dialog input{width:100%;padding:9px;border:1px solid var(--border);border-radius:7px}
.legend{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.93);border:1px solid var(--border);border-radius:9px;padding:10px 14px;box-shadow:var(--shadow);pointer-events:none;font-size:13px;color:var(--text);display:flex;flex-direction:column;gap:6px;max-height:80%;overflow-y:auto;z-index:5}
.legend-item{display:flex;align-items:center;gap:8px;font-weight:500}
.legend-color{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,0.1);flex-shrink:0}
.range-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.range-field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted)}
.range-field input{width:100%;padding:9px;border:1px solid var(--border);border-radius:7px;font-variant-numeric:tabular-nums}
.export-note{font-size:12px;color:var(--muted);margin:4px 0 0}
.export-error{min-height:16px;font-size:12px;color:var(--danger);font-weight:600;margin-top:6px}

/* ============ PARAMETER EDITOR ============ */
.parameter-editor{display:flex;flex-direction:column;gap:14px}
.parameter-intro{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.parameter-list{display:flex;flex-direction:column;gap:10px}
.parameter-row{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--panel2)}
.parameter-row-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.parameter-name{display:flex;align-items:center;gap:8px}
.parameter-symbol{min-width:28px;height:28px;padding:0 8px;display:grid;place-items:center;border-radius:7px;background:var(--accent);color:#fff;font-weight:800;font-family:"Cambria Math",Georgia,serif}
.parameter-use{color:var(--muted);font-size:11px}
.parameter-remove{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--muted);cursor:pointer;font-size:17px;line-height:1}
.parameter-remove:hover{color:var(--danger);border-color:var(--danger);background:#fff}
.parameter-range-grid{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px}
.parameter-range-grid label,.add-parameter-grid label{display:flex;flex-direction:column;gap:4px}
.parameter-range-grid label span,.add-parameter-grid label span{font-size:9px;font-weight:800;letter-spacing:.7px;color:var(--muted)}
.parameter-range-grid input,.add-parameter-grid input{width:100%;min-width:0;padding:8px 9px;border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--text);outline:none}
.parameter-range-grid input:focus,.add-parameter-grid input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,111,237,.1)}
.parameter-screen-option{display:flex;flex-direction:column;gap:4px}
.parameter-screen-option>span{font-size:9px;font-weight:800;letter-spacing:.7px;color:var(--muted)}
.add-screen-parameter{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--accent);border-radius:7px;background:#fff;color:var(--accent);font-weight:700;cursor:pointer;white-space:nowrap}
.add-screen-parameter:hover{background:#eef4ff}
.add-screen-parameter.active{background:var(--accent);color:#fff}
.expression-parameter-controls{display:flex;flex-direction:column;gap:8px;margin:8px 0 0 0;width:100%}
.expression-parameter-control{padding:8px 10px;border:1px solid #cddcff;border-radius:8px;background:#f7faff}
.expression-parameter-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.expression-parameter-name{min-width:24px;height:22px;padding:2px 7px;display:inline-grid;place-items:center;border-radius:5px;background:var(--accent);color:#fff;font-weight:800;font-family:"Cambria Math",Georgia,serif;font-size:13px}
.expression-parameter-value{min-width:68px;padding:3px 7px;border:1px solid var(--border);border-radius:5px;background:#fff;color:var(--text);text-align:center;font-size:11px;font-variant-numeric:tabular-nums}
.expression-parameter-actions{display:flex;align-items:center;gap:5px;margin-left:auto}
.parameter-edit-btn,.parameter-play-btn{min-height:28px;padding:4px 9px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap}
.parameter-edit-btn:hover{border-color:var(--accent);color:var(--accent);background:#f7faff}
.parameter-play-btn{border-color:var(--accent);color:var(--accent)}
.parameter-play-btn:hover:not(:disabled){background:var(--accent);color:#fff}
.parameter-play-btn:disabled{opacity:.7;cursor:not-allowed}
.parameter-inline-editor{margin:6px 0 8px;padding:8px;border:1px dashed #b9cdf8;border-radius:7px;background:#fff}
.parameter-inline-editor[hidden]{display:none}
.parameter-inline-editor-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:end}
.parameter-inline-editor-grid label{display:flex;flex-direction:column;gap:3px}
.parameter-inline-editor-grid label span{font-size:8px;font-weight:800;letter-spacing:.5px;color:var(--muted)}
.parameter-edit-min,.parameter-edit-max,.parameter-edit-value{width:100%;height:30px;min-width:0;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);font-size:12px}
.parameter-save-btn{height:30px;padding:0 12px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;cursor:pointer}
.parameter-save-btn:hover{background:#2558c8}
.expression-parameter-slider-row{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:7px}
.expression-parameter-slider{width:100%;accent-color:var(--accent);cursor:pointer}
.expression-parameter-min,.expression-parameter-max{color:var(--muted);font-size:9px;font-variant-numeric:tabular-nums}
.expression-parameter-max{text-align:right}
.expression-parameter-add{margin:7px 0 0;padding:8px;border:1px dashed #b9cdf8;border-radius:8px;background:#f8fbff}
.expression-parameter-add[hidden]{display:none}
.expression-parameter-add-grid{display:grid;grid-template-columns:1.1fr .8fr .8fr .8fr auto;gap:6px;align-items:end}
.expression-parameter-add-grid label{display:flex;flex-direction:column;gap:3px}
.expression-parameter-add-grid label span{font-size:8px;font-weight:800;letter-spacing:.5px;color:var(--muted)}
.inline-param-name,.inline-param-min,.inline-param-max,.inline-param-value{width:100%;min-width:0;height:32px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);outline:none;font-size:12px}
.inline-param-name:focus,.inline-param-min:focus,.inline-param-max:focus,.inline-param-value:focus{border-color:var(--accent)}
.inline-param-add{height:32px;padding:0 12px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.inline-param-add:hover{background:#2558c8}
.parameter-slider-line{display:grid;grid-template-columns:1fr 82px;align-items:center;gap:10px;margin-top:11px}
.parameter-slider{width:100%;accent-color:var(--accent);cursor:pointer}
.parameter-output{width:82px;padding:7px 8px;border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--text);text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.parameter-empty{padding:13px;border:1px dashed var(--border);border-radius:9px;background:var(--panel2);display:flex;flex-direction:column;gap:5px;font-size:12px}
.parameter-empty span{color:var(--muted);line-height:1.4}
.add-parameter-box{border:1px solid #cddcff;border-radius:10px;padding:12px;background:#f7faff}
.add-parameter-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:10px}
.add-parameter-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.add-parameter-action{height:36px;padding:0 13px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:#fff;font-weight:700;white-space:nowrap;cursor:pointer}
.add-parameter-action:hover{background:#2558c8}
.parameter-help{margin-top:9px;color:var(--muted);font-size:11px;line-height:1.45}

/* ============ ANIMATION ============ */
.animation-dialog{display:flex;flex-direction:column;gap:12px}
.animation-dialog-intro{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.animation-list{display:flex;flex-direction:column;gap:9px;max-height:52vh;overflow:auto;padding-right:2px}
.animation-expression-row{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--panel2)}
.animation-expression-row.disabled{opacity:.58}
.animation-expression-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.animation-expression-check{width:18px;height:18px;accent-color:var(--accent);flex:none}
.animation-expression-name{min-width:0;flex:1;display:flex;align-items:center;gap:7px;font-weight:800;font-size:12px}
.animation-expression-dot{width:11px;height:11px;border-radius:50%;flex:none}
.animation-expression-equation{color:var(--muted);font-family:"Cambria Math",Georgia,serif;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.animation-config-grid{display:grid;grid-template-columns:1.15fr .8fr;gap:8px}
.animation-config-grid label{display:flex;flex-direction:column;gap:4px}
.animation-config-grid label span{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--muted)}
.animation-config-grid select,.animation-config-grid input{width:100%;height:36px;min-width:0;padding:6px 9px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text)}
.animation-config-grid select:disabled,.animation-config-grid input:disabled{background:#eef1f5;color:#98a3b5}
.animation-no-parameter{padding:8px 9px;border:1px dashed var(--border);border-radius:7px;color:var(--muted);font-size:11px;background:#fff}
.animation-dialog-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.animation-selection-count{color:var(--muted);font-size:11px}
.animation-start-btn{min-height:38px;padding:0 14px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;font-weight:800}
.animation-start-btn:hover{background:#2558c8}
.animation-empty{padding:12px;border:1px dashed var(--border);border-radius:9px;color:var(--muted);font-size:12px;background:var(--panel2)}
@media(max-width:600px){
  .animation-config-grid{grid-template-columns:1fr 1fr}
  .animation-expression-equation{max-width:42vw}
}

/* ============ AUTOCOMPLETE ============ */
.autocomplete{
  position:fixed;z-index:200;background:#fff;border:1px solid var(--border);
  border-radius:9px;box-shadow:0 10px 30px rgba(24,34,53,.16);
  max-height:210px;overflow:auto;display:none;min-width:200px;padding:4px;
}
.autocomplete.show{display:block}
.autocomplete-item{padding:7px 10px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;border-radius:6px;align-items:center}
.autocomplete-item:hover,.autocomplete-item.active{background:var(--panel2);color:var(--accent)}
.autocomplete-item small{color:var(--muted);font-size:10px}
.autocomplete-item code{font-family:"Cambria Math",Georgia,serif;font-weight:700}

/* ============ TABLE / SYNTAX HELP ============ */
.data-table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.data-table th,.data-table td{border:1px solid var(--border);padding:5px 8px;text-align:right}
.data-table th{background:var(--panel2);font-weight:800;color:var(--muted);font-size:10px;letter-spacing:.5px}
.syntax-help{font-size:12px;line-height:1.6}
.syntax-help h3{margin:14px 0 6px;font-size:12px;letter-spacing:.6px;color:var(--accent);text-transform:uppercase}
.syntax-help code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-family:"Cambria Math",Georgia,serif;font-size:12px}
.syntax-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
@media(max-width:600px){.syntax-grid{grid-template-columns:1fr}}

/* ============ MOBILE ============ */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:19;opacity:0;transition:opacity 0.2s}
.sidebar-overlay.show{display:block;opacity:1}
.fab{display:none;position:absolute;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:white;font-size:28px;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(47,111,237,0.4);border:none;z-index:10;padding:0;line-height:1}
.zoom-controls{position:absolute;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:10}
.zoom-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.95);border:1px solid var(--border);color:var(--text);font-size:24px;font-weight:bold;display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer;transition:all 0.1s;padding:0;line-height:1}
.zoom-btn:hover{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.zoom-btn:active{transform:scale(0.92);background:var(--accent);color:white}

@media(max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr}
  .main.collapsed{grid-template-columns:1fr}

<script>
"use strict";

/* =========================================================================
   GANITH — EXTENDED MATHEMATICAL ENGINE  (FIXED BUILD)
   -------------------------------------------------------------------------
   Fixes in this build:
     • Canvas sizing is now robust: retries + parent-size fallback + extra
       resize hooks (orientationchange / visualViewport / delayed timers).
       Previously width/height could stay 0, so nothing was ever drawn.
     • draw() is wrapped in try/catch and auto-resizes if it is called with
       a zero-sized canvas.
     • math.js imports use override:true and are guarded (no silent crash).
     • mod() now accepts ONE argument and returns |x| (the "modulus"
       meaning used in Indian curricula), so `y = mod(x)` plots correctly.
       Two arguments still behave as the modulo operator.
     • User-defined functions f(x)=… are no longer broken by the implicit
       multiplication pass (f(x) stays f(x), not f*(x)).
     • Discontinuity detection in plotYofX / plotXofY is now measured in
       screen pixels instead of world units.
========================================================================= */

/* ------------------------------ utilities ------------------------------ */

function uid(){
  if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
    try { return crypto.randomUUID(); } catch(e){}
  }
  if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function") {
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map(x => x.toString(16).padStart(2,"0"));
    return h.slice(0,4).join("")+"-"+h.slice(4,6).join("")+"-"+h.slice(6,8).join("")+"-"+h.slice(8,10).join("")+"-"+h.slice(10,16).join("");
  }
  return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
}

function splitTop(s, delim){
  const out=[]; let depth=0, cur="";
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(c==="("||c==="["||c==="{") depth++;
    else if(c===")"||c==="]"||c==="}") depth--;
    if(depth===0 && s.startsWith(delim,i)){
      out.push(cur); cur=""; i+=delim.length-1; continue;
    }
    cur+=c;
  }
  out.push(cur);
  return out;
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function escapeJs(value){
  return String(value).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}
function cssEscape(value){
  if(window.CSS && typeof window.CSS.escape==="function") return window.CSS.escape(String(value));
  return String(value).replace(/[^a-zA-Z0-9_-]/g,"\\$&");
}
function formatParameterValue(value){
  const n=Number(value);
  if(!Number.isFinite(n))return "—";
  if(Math.abs(n)>=1000 || (Math.abs(n)<0.001 && n!==0)) return n.toExponential(3);
  return Number(n.toFixed(6)).toString();
}
function formatTick(v){
  if(Math.abs(v)>=1000)return v.toExponential(1);
  if(Math.abs(v)<.001 && v!==0)return v.toExponential(1);
  return Number(v.toFixed(4)).toString();
}
function safeFileName(v){ return String(v).replace(/[^0-9a-zA-Z._-]/g,""); }
function roundRectPath(ctx,x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function interpolate(x1,y1,x2,y2,f1,f2){
  const t=f1/(f1-f2);
  return {x:x1+(x2-x1)*t,y:y1+(y2-y1)*t};
}
function hexToRgba(hex,alpha){
  const h=String(hex).replace("#","");
  const full = h.length===3 ? h.split("").map(c=>c+c).join("") : h;
  const n=parseInt(full,16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ------------------------------ colors --------------------------------- */

const COLORS = ["#315bd6","#e53935","#169c6b","#8e44ad","#e67e22","#0097a7","#c2185b","#5d6d7e"];

/* ------------------------- token tables -------------------------------- */

const FUNCTION_TOKENS = [
  "doubleFactorial","positivePart","negativePart","nthroot","listRange",

  "nPr","nCr","gcd","lcm","mod",
  "vector","arrow","point","segment","circle",

FUNCTION_TOKENS.sort((a,b)=>b.length-a.length);

const GREEK_NAMES = [
  "alpha","beta","gammaConst","delta","epsilon","zeta","eta",
  "theta","iota","kappa","lambda","mu","nu","xi","omicron",
  "rho","sigma","upsilon","omega","Omega","Sigma","Gamma",
  "Delta","Theta","Lambda","Phi","Psi","Pi"
];

const CONSTANT_NAMES = ["pi","e","phi","tau","Infinity", ...GREEK_NAMES];

const GREEK_MAP = {
  "π":"pi","θ":"theta","φ":"phi","τ":"tau","α":"alpha","β":"beta",
  "γ":"gammaConst","δ":"delta","ε":"epsilon","ζ":"zeta","η":"eta",
  "ι":"iota","κ":"kappa","λ":"lambda","μ":"mu","ν":"nu","ξ":"xi",
  "ρ":"rho","σ":"sigma","ω":"omega","Ω":"Omega","Σ":"Sigma","Γ":"Gamma",
  "Δ":"Delta","Θ":"Theta","Λ":"Lambda","Φ":"Phi","Ψ":"Psi","Π":"Pi",
  "∞":"Infinity","≤":"<=","≥":">=","≠":"!=","≈":"=",
  "×":"*","÷":"/","−":"-","·":"*","√":"sqrt","∛":"cbrt",
  "²":"^2","³":"^3","⁴":"^4","⁵":"^5","⁶":"^6","⁷":"^7","⁸":"^8","⁹":"^9",
  "¹":"^1","⁰":"^0","⁻":"^-","∑":"sum","∏":"prod","∫":"integral",
  "∂":"derivative","∧":" and ","∨":" or ","¬":" not "
};

const SPECIAL_FNS = new Set(["sum","prod","deriv","derivative","integ","integral"]);

/* --------------------------- preprocessing ----------------------------- */

function replaceAbsBars(s){
  let out="";
  let i=0;
  while(i<s.length){
    if(s[i]==="|" && s[i+1]!=="|"){
      let depth=0, j=i+1, found=-1;
      while(j<s.length){
        if(s[j]==="|" && s[j+1]!=="|" && depth===0){ found=j; break; }
        if(s[j]==="(") depth++;
        else if(s[j]===")") depth--;
        j++;
      }
      if(found>0){
        out += "abs(" + replaceAbsBars(s.slice(i+1,found)) + ")";
        i = found+1;
        continue;
      }
    }
    out += s[i];
    i++;
  }
  return out;
}

function rewriteModulo(s){
  let out = String(s);
  let guard = 0;
  while(out.indexOf("%") !== -1 && guard++ < 100){
    const idx = out.indexOf("%");
    let i = idx-1;
    while(i>=0 && out[i]===" ") i--;
    let depth=0, start=i;
    while(start>=0){
      const c=out[start];
      if(c===")"||c==="]") depth++;
      else if(c==="("||c==="["){ if(depth===0) break; depth--; }
      else if(depth===0 && "+-*/^,<>=:;".includes(c)) break;
      start--;
    }
    start++;
    let j=idx+1;
    while(j<out.length && out[j]===" ") j++;
    let d2=0, end=j;
    while(end<out.length){
      const c=out[end];
      if(c==="("||c==="[") d2++;
      else if(c===")"||c==="]"){ if(d2===0) break; d2--; }
      else if(d2===0 && "+-*/^%,<>=:;".includes(c)) break;
      end++;
    }
    const L = out.slice(start, idx).trim();
    const R = out.slice(j, end).trim();
    if(!L || !R){ break; }
    out = out.slice(0,start) + "mod(" + L + ", " + R + ")" + out.slice(end);
  }
  return out;
}

function preprocessText(raw){
  let s = String(raw);

  for(const k of Object.keys(GREEK_MAP)){
    if(s.indexOf(k) !== -1) s = s.split(k).join(GREEK_MAP[k]);
  }

  s = s.replace(/\b([A-Za-z])\s*'\s*\(\s*([A-Za-z])\s*\)/g, "derivative($1($2), $2)");
  s = s.replace(/([A-Za-z0-9_)])\s*'\s*'/g, "derivative(derivative($1,x),x)");
  s = s.replace(/([A-Za-z0-9_)])\s*'/g, "derivative($1,x)");

  s = replaceAbsBars(s);

  s = s.replace(/\[\s*([^\[\]]+?)\s*\]/g, (m, inner)=>{
    const mm = inner.match(/^(.+?)\s*\.\.\.\s*(.+)$/);
    if(!mm) return m;
    const leftParts = splitTop(mm[1], ",").map(x=>x.trim()).filter(Boolean);
    const end = mm[2].trim();
    if(leftParts.length === 1) return `listRange(${leftParts[0]}, ${end}, 1)`;
    if(leftParts.length === 2) return `listRange(${leftParts[0]}, ${end}, ${leftParts[1]})`;
    return m;
  });

  s = s.replace(/\{\s*([^{}]+?)\s*\}/g, (m, cond)=> cond.trim() ? ` {domainOK(${cond})}` : m);

  s = rewriteModulo(s);

  return s;
}

/* names of functions the user defined with  f(x) = ...  */
function userDefinedFunctionNames(){
  try{
    const g = (typeof App !== "undefined" && App.state) ? App.state.globals : null;
    if(!g) return [];
    return Object.keys(g).filter(k=>g[k] && g[k].kind === "fn");
  }catch(_){ return []; }
}

function normalizeFunctionAdjacency(text){
  const userFns = userDefinedFunctionNames();
  const fnNames = [...FUNCTION_TOKENS, ...userFns].sort((a,b)=>b.length-a.length);
  const fnSet = new Set(fnNames);
  const constants = new Set(CONSTANT_NAMES);

  let s = String(text);

  /* 1. parameter directly before a known function: bsin(x) → b*sin(x) */
  const fnPattern = fnNames.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
  if(fnPattern){
    const suffixRE = new RegExp(`([A-Za-z])(${fnPattern})(?=\\s*\\()`,"g");
    s = s.replace(suffixRE, (match,prefix,fn)=>{
      if(prefix===fn || fnSet.has(prefix)) return match;
      return `${prefix}*${fn}`;
    });
  }

  /* 2. split ordinary alphabetic runs into single letters */
  s = s.replace(/[A-Za-z_][A-Za-z_0-9]*/g, token=>{
    if(fnSet.has(token) || constants.has(token)) return token;
    if(/[0-9_]/.test(token)) return token;
    if(token.length>1) return token.split("").join("*");
    return token;
  });

  /* 3. numeric / parenthesis adjacency */
  s = s
    .replace(/(\d|\))\s*(?=[A-Za-z_(])/g,"$1*")
    .replace(/([A-Za-z_]\w*)\s*(?=\()/g,"$1*")
    .replace(/\)\s*(?=[A-Za-z_0-9(])/g,")*");

  /* 4. restore real function calls (including user-defined ones) */
  if(fnPattern){
    const functionCallRE = new RegExp(`\\b(${fnPattern})\\s*\\*\\s*(?=\\()`,`g`);
    s = s.replace(functionCallRE,"$1");
  }

  return s;
}

function detectVariables(text){
  const reserved = new Set([...FUNCTION_TOKENS, ...CONSTANT_NAMES, "x","y","t","n","z","r"]);
  const normalized = normalizeFunctionAdjacency(preprocessText(text));
  return [...new Set((normalized.match(/[A-Za-z_]\w*/g)||[]).filter(x=>!reserved.has(x)))];
}

/* -------------------------- recursive evaluator ------------------------ */

function treeHasSpecial(node){
  let found = false;
  try{
    node.traverse(n=>{
      if(n && n.isFunctionNode && n.fn && SPECIAL_FNS.has(n.fn.name)) found = true;
    });
  }catch(e){}
  return found;
}

function factorialNum(n){
  n = Math.trunc(n);
  if(!Number.isFinite(n) || n<0 || n>170) return NaN;
  let r=1; for(let i=2;i<=n;i++) r*=i; return r;
}

function applyOperator(op, args){
  if(args.length===1){
    if(op==="-") return -args[0];
    if(op==="+") return +args[0];
    if(op==="!") return factorialNum(args[0]);
    if(op==="not") return !args[0];
    if(op==="~") return ~args[0];
  }
  switch(op){
    case "+": return args[0]+args[1];
    case "-": return args[0]-args[1];
    case "*": return args[0]*args[1];
    case "/": return args[0]/args[1];
    case "^": return Math.pow(args[0],args[1]);
    case "%": return args[0]%args[1];
    case "<": return args[0]<args[1];
    case ">": return args[0]>args[1];
    case "<=": return args[0]<=args[1];
    case ">=": return args[0]>=args[1];
    case "==": return args[0]===args[1];
    case "!=": return args[0]!==args[1];
    case "and": return args.every(v=>!!v);
    case "or": return args.some(v=>!!v);
    case "xor": return args.filter(v=>!!v).length%2===1;
  }
  return NaN;
}

function callMathFn(name, args, scope){
  if(scope && typeof scope[name] === "function"){
    try{ return scope[name](...args); }catch(e){ return NaN; }
  }
  const fn = math[name];
  if(typeof fn === "function"){
    try{ return fn(...args); }catch(e){ return NaN; }
  }
  return NaN;
}

function evalNode(node, scope){
  if(!node) return NaN;
  try{
    if(node.isConstantNode) return node.value;
    if(node.isSymbolNode){
      const v = scope[node.name];
      return v === undefined ? NaN : v;
    }
    if(node.isParenthesisNode) return evalNode(node.content, scope);
    if(node.isArrayNode) return node.items.map(n=>evalNode(n,scope));
    if(node.isOperatorNode){
      const args = node.args.map(a=>evalNode(a,scope));
      return applyOperator(node.op, args);
    }
    if(node.isFunctionNode){
      const name = node.fn && node.fn.name ? node.fn.name : null;
      if(name === "sum" || name === "prod") return evalSeries(name, node.args, scope);
      if(name === "deriv" || name === "derivative") return evalDerivative(node.args, scope);
      if(name === "integ" || name === "integral") return evalIntegral(node.args, scope);
      const args = node.args.map(a=>evalNode(a,scope));
      return callMathFn(name, args, scope);
    }
    if(node.isConditionalNode){
      const c = evalNode(node.condition, scope);
      return c ? evalNode(node.trueExpr, scope) : evalNode(node.falseExpr, scope);
    }
    if(typeof node.compile === "function"){
      const c = node.compile();
      return Number(c.evaluate(scope));
    }
  }catch(e){ return NaN; }
  return NaN;
}

function evalSeries(kind, args, scope){
  if(args.length < 4) return NaN;
  const varName = args[0].isSymbolNode ? args[0].name : null;
  if(!varName) return NaN;
  const from = Number(evalNode(args[1], scope));
  const to   = Number(evalNode(args[2], scope));
  const body = args[3];
  if(!Number.isFinite(from) || !Number.isFinite(to)) return NaN;
  const start = Math.ceil(from), end = Math.floor(to);
  const N = end - start;
  if(N < 0 || N > 200000) return NaN;
  let acc = kind === "sum" ? 0 : 1;
  for(let k=start; k<=end; k++){
    const v = Number(evalNode(body, Object.assign({}, scope, {[varName]:k})));
    if(!Number.isFinite(v)) return NaN;
    acc = kind === "sum" ? acc + v : acc * v;
  }
  return acc;
}

function evalDerivative(args, scope){
  if(args.length < 1) return NaN;
  const body = args[0];
  const varName = (args[1] && args[1].isSymbolNode) ? args[1].name : "x";
  const at = args[2] ? Number(evalNode(args[2], scope))
                     : Number(scope[varName]);
  if(!Number.isFinite(at)) return NaN;
  const h = 1e-5 * Math.max(1, Math.abs(at));
  const f1 = Number(evalNode(body, Object.assign({}, scope, {[varName]: at+h})));
  const f2 = Number(evalNode(body, Object.assign({}, scope, {[varName]: at-h})));
  return (f1-f2)/(2*h);
}

function evalIntegral(args, scope){
  if(args.length < 4) return NaN;
  const body = args[0];
  const varName = (args[1] && args[1].isSymbolNode) ? args[1].name : "x";
  const a = Number(evalNode(args[2], scope));
  const b = Number(evalNode(args[3], scope));
  if(!Number.isFinite(a) || !Number.isFinite(b)) return NaN;
  const N = 400;
  const h = (b-a)/N;
  let sum = 0;
  for(let i=0;i<=N;i++){
    const t = a + i*h;
    const v = Number(evalNode(body, Object.assign({}, scope, {[varName]: t})));
    if(!Number.isFinite(v)) return NaN;
    sum += v * (i===0 || i===N ? 1 : (i%2 ? 4 : 2));
  }
  return sum*h/3;
}

/* -------------------------- polynomial fitting -------------------------- */

function polyFit(points, degree){
  const n = degree+1;
  const A = Array.from({length:n},()=>new Array(n).fill(0));
  const B = new Array(n).fill(0);
  for(let i=0;i<n;i++){
    for(let j=0;j<n;j++){
      let s=0;
      for(const p of points) s += Math.pow(p[0], i+j);
      A[i][j]=s;
    }
    let s=0;
    for(const p of points) s += p[1]*Math.pow(p[0], i);
    B[i]=s;
  }
  for(let i=0;i<n;i++){
    let maxRow=i;
    for(let k=i+1;k<n;k++) if(Math.abs(A[k][i])>Math.abs(A[maxRow][i])) maxRow=k;
    if(Math.abs(A[maxRow][i])<1e-12) return null;
    [A[i],A[maxRow]]=[A[maxRow],A[i]];
    [B[i],B[maxRow]]=[B[maxRow],B[i]];
    for(let k=i+1;k<n;k++){
      const f = A[k][i]/A[i][i];
      for(let j=i;j<n;j++) A[k][j]-=f*A[i][j];
      B[k]-=f*B[i];
    }
  }
  const x = new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){
    let s=B[i];
    for(let j=i+1;j<n;j++) s-=A[i][j]*x[j];
    x[i]=s/A[i][i];
  }
  return x;
}

/* ============================== APP ==================================== */

const App = {

    expressions:[], selected:null, points:[], segments:[], circles:[],
    angleMode:"rad", mode:"cartesian", trace:false, animating:false, t:0,
    parameterAnimations:{}, globals:{}
  },
  history:[], future:[], suppressHistory:false,

  init(){

      this.loadDemo();
      UI.bind();
      Graph.init();

      this.render();
      const status = document.getElementById("status");
      if(status) status.textContent = "Math engine unavailable — connect to internet and reload";
      return;
    }

    }catch(err){

    }
    this.loadDemo();
    UI.bind();
    Graph.init();
    this.scheduleResizes();
    requestAnimationFrame(()=>{ Graph.resize(); this.rebuildGlobals(); this.render(); });
    this.render();
  },

  /* Canvas size can be 0 on the very first frames on some mobile
     browsers — hammer it with a few delayed resizes. */
  scheduleResizes(){
    [0, 50, 150, 350, 700, 1200].forEach(ms=>{
      setTimeout(()=>{ try{ Graph.resize(); }catch(_){} }, ms);
    });
  },

  registerMathFunctions(){
    const f = {};
    const isDeg = () => App.state.angleMode === "deg";
    const degToRad = x => x * Math.PI / 180;
    const radToDeg = x => x * 180 / Math.PI;

    /* --- basic trigonometric --- */
    f.sin = x => Math.sin(isDeg() ? degToRad(x) : x);
    f.cos = x => Math.cos(isDeg() ? degToRad(x) : x);
    f.tan = x => Math.tan(isDeg() ? degToRad(x) : x);
    f.sec = x => 1 / f.cos(x);
    f.csc = x => 1 / f.sin(x);
    f.cot = x => 1 / f.tan(x);

    /* --- inverse trigonometric --- */
    f.asin = x => { const r = Math.asin(x); return isDeg() ? radToDeg(r) : r; };
    f.acos = x => { const r = Math.acos(x); return isDeg() ? radToDeg(r) : r; };
    f.atan = x => { const r = Math.atan(x); return isDeg() ? radToDeg(r) : r; };
    f.asec = x => f.acos(1/x);
    f.acsc = x => f.asin(1/x);
    f.acot = x => { const r = Math.PI/2 - Math.atan(x); return isDeg() ? radToDeg(r) : r; };

    /* --- hyperbolic --- */
    f.sinh = x => Math.sinh(x);
    f.cosh = x => Math.cosh(x);
    f.tanh = x => Math.tanh(x);
    f.sech = x => 1/Math.cosh(x);
    f.csch = x => 1/Math.sinh(x);
    f.coth = x => 1/Math.tanh(x);

    /* --- inverse hyperbolic --- */
    f.asinh = x => Math.asinh(x);
    f.acosh = x => Math.acosh(x);
    f.atanh = x => Math.atanh(x);
    f.asech = x => Math.acosh(1/x);
    f.acsch = x => Math.asinh(1/x);
    f.acoth = x => Math.atanh(1/x);

    /* --- logarithms / exponentials / roots --- */
    f.log10 = x => Math.log10(x);
    f.log2 = x => Math.log2(x);
    f.logb = (x,b) => Math.log(x)/Math.log(b);
    f.exp = x => Math.exp(x);
    f.cbrt = x => Math.cbrt(x);
    f.nthroot = (x,n) => {
      n = Number(n);
      if(!Number.isFinite(n) || n===0) return NaN;
      if(x < 0 && Math.abs(n % 2) === 1) return -Math.pow(-x, 1/n);
      return Math.pow(x, 1/n);
    };
    f.sqrt = x => Math.sqrt(x);

    /* --- FIX: mod with one argument = |x| (modulus), two = modulo --- */
    f.mod = function(a, b){
      const A = Number(a);
      if(b === undefined || b === null || typeof b === "object"){
        return Math.abs(A);           /* y = mod(x)  →  y = |x| */
      }
      const B = Number(b);
      if(!Number.isFinite(A) || !Number.isFinite(B) || B === 0) return NaN;
      return A - B*Math.floor(A/B);   /* always positive remainder  */
    };

    /* --- piecewise / parts / logic helpers --- */
    f.positivePart = x => Math.max(x,0);
    f.negativePart = x => Math.min(x,0);
    f.clamp = (x,a,b) => Math.min(Math.max(x,a),b);
    f.frac = x => x-Math.floor(x);
    f.domainOK = () => true;
    f.piecewise = function(){
      const args = Array.prototype.slice.call(arguments);
      let i = 0;
      while(i+1 < args.length){
        const cond = args[i], val = args[i+1];
        const truth = (typeof cond === "boolean") ? cond
                    : (typeof cond === "number") ? cond !== 0
                    : false;
        if(truth) return val;
        i += 2;
      }
      if(i < args.length) return args[i];
      return NaN;
    };

    /* --- number theory / combinatorics --- */
    f.factorial = n => factorialNum(n);
    f.gcd = (a,b) => { a=Math.abs(Math.trunc(a)); b=Math.abs(Math.trunc(b)); while(b){const t=b;b=a%b;a=t;} return a; };
    f.lcm = (a,b) => { a=Math.trunc(a); b=Math.trunc(b); if(a===0||b===0) return 0; return Math.abs(a*b/f.gcd(a,b)); };
    f.isPrime = n => {
      n=Math.trunc(n); if(n<2)return 0; if(n===2)return 1; if(n%2===0)return 0;
      for(let i=3;i*i<=n;i+=2) if(n%i===0) return 0; return 1;
    };
    f.nPr = (n,r) => {
      n=Math.trunc(n); r=Math.trunc(r);
      if(r<0||n<0||r>n) return NaN;
      let z=1; for(let i=0;i<r;i++) z*=n-i; return z;
    };
    f.nCr = (n,r) => {
      n=Math.trunc(n); r=Math.trunc(r);
      if(r<0||n<0||r>n) return NaN;
      r=Math.min(r,n-r);
      let z=1; for(let i=1;i<=r;i++) z=z*(n-r+i)/i; return z;
    };
    f.doubleFactorial = n => {
      n=Math.trunc(n); if(n<0) return NaN;
      let z=1; for(let i=n;i>0;i-=2) z*=i; return z;
    };

    /* --- special functions --- */
    f.sinc = x => Math.abs(x)<1e-12 ? 1 : Math.sin(x)/x;
    f.erf = x => erfApprox(x);
    f.erfc = x => 1-erfApprox(x);
    f.gamma = x => gammaApprox(x);
    f.gammaConst = 0.5772156649015329;

    /* --- statistics --- */
    const toArr = a => Array.isArray(a) ? a : [a];
    f.mean = a => { const arr=toArr(a); return arr.reduce((s,v)=>s+v,0)/arr.length; };
    f.median = a => {
      const arr=toArr(a).slice().sort((x,y)=>x-y);
      if(!arr.length) return NaN;
      const m=Math.floor(arr.length/2);
      return arr.length%2 ? arr[m] : (arr[m-1]+arr[m])/2;
    };
    f.mode = a => {
      const arr=toArr(a), counts=new Map();
      arr.forEach(v=>counts.set(v,(counts.get(v)||0)+1));
      let best=null,bc=0;
      counts.forEach((c,v)=>{ if(c>bc){bc=c;best=v;} });
      return best;
    };
    f.variance = a => {
      const arr=toArr(a), m=f.mean(arr);
      return arr.reduce((s,v)=>s+(v-m)**2,0)/arr.length;
    };
    f.stddev = a => Math.sqrt(f.variance(a));
    f.sum = a => { const arr = Array.isArray(a) ? a : [a]; return arr.reduce((s,v)=>s+Number(v||0),0); };
    f.prod = a => { const arr = Array.isArray(a) ? a : [a]; return arr.reduce((s,v)=>s*Number(v||1),1); };

    /* --- list utilities --- */
    f.listRange = (a, b, step) => {
      const out = [];
      a = Number(a); b = Number(b);
      step = Number(step);
      if(!Number.isFinite(a) || !Number.isFinite(b)) return out;
      if(!Number.isFinite(step) || step === 0) step = 1;
      step = Math.abs(step);
      if(a <= b){ for(let v=a; v<=b+1e-12; v+=step) out.push(Number(v.toFixed(12))); }
      else { for(let v=a; v>=b-1e-12; v-=step) out.push(Number(v.toFixed(12))); }
      return out;
    };

    try{ math.import(f, { override:true }); }catch(e){ console.error(e); }
    try{ math.import({ phi: (1+Math.sqrt(5))/2, tau: 2*Math.PI }, { override:true }); }catch(e){}

    /* Greek aliases — only add names that math.js does not already own */
    const greekVals = {
      alpha:1, beta:2, delta:1, epsilon:1,
      zeta:1, eta:1, theta:1, iota:1, kappa:1, lambda:1, mu:1, nu:1,
      xi:1, rho:1, sigma:1, upsilon:1, omega:1,
      Omega:1, Sigma:1, Gamma:1, Delta:1, Theta:1, Lambda:1, Phi:1,
      Psi:1, Pi:Math.PI
    };
    Object.keys(greekVals).forEach(name=>{
      try{
        if(math[name] === undefined){
          math.import({ [name]: greekVals[name] }, { override:true });
        }
      }catch(e){}
    });
  },

    const item = {
      id:uid(),
      text,
      visible:true,
      color:COLORS[this.state.expressions.length % COLORS.length],
      label:"f"+(this.state.expressions.length+1)+"(x)",

    };

  updateExpression(id, text){
    const e = this.state.expressions.find(x=>x.id===id);
    if(!e) return;
    e.text = text;
    this.pushHistoryDebounced();
    this.rebuildGlobals();
    this.refreshExpressionMeta(id);

  },

  deleteExpression(id){
    if(this.state.parameterAnimations && this.state.parameterAnimations[id]){
      UI.stopParameterAnimation(id);
    }

    if(!e) return;
    const copy = Object.assign({}, e, {
      id:uid(),
      label:e.label+" copy",
      parameters: e.parameters ? JSON.parse(JSON.stringify(e.parameters)) : {}
    });

  /* ---- function definitions & variable assignments ------------------- */

  rebuildGlobals(){
    const globals = {};
    this.state.expressions.forEach(e=>{
      if(!e.text.trim()) return;
      const cls = this.classifyExpression(e.text);
      if(cls.type === "fndef"){
        globals[cls.name] = { kind:"fn", arg:cls.arg, expr:cls.expr, source:e.id };
      } else if(cls.type === "assignment"){
        globals[cls.name] = { kind:"value", expr:cls.expr, source:e.id };
      }
    });
    this.state.globals = globals;
  },

  buildGlobalScope(){
    const scope = {};
    for(const name of Object.keys(this.state.globals || {})){
      const def = this.state.globals[name];
      if(def.kind === "value"){
        let v = NaN;
        try{
          const entry = Graph.getCompiled(def.expr);
          if(entry && entry.kind === "compiled") v = Number(entry.eval.evaluate({ pi:Math.PI, e:Math.E }));
          else if(entry && entry.kind === "tree") v = Number(evalNode(entry.node, { pi:Math.PI, e:Math.E }));
        }catch(_){}
        scope[name] = v;
      } else if(def.kind === "fn"){
        const argName = def.arg;
        const exprText = def.expr;
        scope[name] = function(v){
          return App.evalExpr(exprText, { [argName]: v }, null);
        };
      }
    }
    return scope;
  },

  evalExpr(expr, scope){
    return Graph.evalExpr(expr, scope, null);
  },

  /* -------------------------- classification -------------------------- */

  classifyExpression(rawText){
    const text = preprocessText(normalizeFunctionAdjacency(rawText)).trim();
    if(!text) return { type:"empty" };

    if(/^\[\s*\(/.test(text) && /\)\s*\]$/.test(text)){
      const inner = text.slice(1,-1);
      const pts = splitTop(inner, ",").map(s=>s.trim()).filter(Boolean);
      if(pts.length && pts.every(p=>/^\(.*\)$/.test(p))){
        return { type:"points", points:pts };
      }
    }

    const tupleM = text.match(/^\(\s*([^,()]+(?:\s*\([^()]*\))?[^,()]*)\s*,\s*([^,()]+(?:\s*\([^()]*\))?[^,()]*)\s*\)$/);
    if(tupleM && /(^|[^A-Za-z0-9_])t([^A-Za-z0-9_]|$)/.test(text)){
      return { type:"parametric", fx:tupleM[1].trim(), fy:tupleM[2].trim() };
    }

    const ptM = text.match(/^\(\s*([^,()]+)\s*,\s*([^,()]+)\s*\)$/);
    if(ptM) return { type:"point", x:ptM[1].trim(), y:ptM[2].trim() };

    if(/^segment\s*\(/i.test(text))    return { type:"segment" };
    if(/^circle\s*\(/i.test(text))     return { type:"circle" };
    if(/^polygon\s*\(/i.test(text))    return { type:"polygon" };
    if(/^point\s*\(/i.test(text))      return { type:"pointFn" };
    if(/^vector\s*\(/i.test(text) || /^arrow\s*\(/i.test(text)) return { type:"vector" };
    if(/^slopeField\s*\(/i.test(text) || /^field\s*\(/i.test(text)) return { type:"slopefield" };
    if(/^fit\s*\(/i.test(text))        return { type:"regression" };
    if(/^table\s*\(/i.test(text))      return { type:"table" };

    const seqM = text.match(/^([A-Za-z])_([A-Za-z0-9]+)\s*=\s*(.+)$/);
    if(seqM) return { type:"sequence", index:seqM[2], expr:seqM[3].trim(), name:seqM[1] };

    const fnDefM = text.match(/^([A-Za-z])\s*\(\s*([A-Za-z])\s*\)\s*=\s*(.+)$/);
    if(fnDefM && !["y","x","r","t","z"].includes(fnDefM[1])){
      return { type:"fndef", name:fnDefM[1], arg:fnDefM[2], expr:fnDefM[3].trim() };
    }

    const asgM = text.match(/^([A-Za-z])\s*=\s*(.+)$/);
    if(asgM && !["y","x","r","t","z"].includes(asgM[1]) && !/[xyt]/.test(asgM[2])){
      return { type:"assignment", name:asgM[1], expr:asgM[2].trim() };
    }

    const ineqM = text.match(/^(.+?)\s*(<=|>=|!=|<|>)\s*(.+)$/);
    if(ineqM){
      return { type:"inequality", lhs:ineqM[1].trim(), op:ineqM[2], rhs:ineqM[3].trim() };
    }

    if(!text.includes("=")){
      if(/[<>]/.test(text)) return { type:"invalid", error:"Inequality needs a comparison." };
      return { type:"y-of-x", expr:text };
    }

    const parts = splitTop(text, "=");
    if(parts.length !== 2) return { type:"invalid", error:"More than one '=' sign." };
    const left = parts[0].trim(), right = parts[1].trim();

    if(left === "r" && !this.containsVar(right,"r")) return { type:"polar", expr:right };
    if(right === "r" && !this.containsVar(left,"r")) return { type:"polar", expr:left };

    if(left === "z") return { type:"complex", expr:right };

    const yLike = v => v === "y" || /^[fgh]\s*\(\s*x\s*\)$/.test(v);
    const xLike = v => v === "x";

    if(yLike(left) && !this.containsVar(right,"y")) return { type:"y-of-x", expr:right };
    if(yLike(right) && !this.containsVar(left,"y")) return { type:"y-of-x", expr:left };
    if(xLike(left) && !this.containsVar(right,"x")) return { type:"x-of-y", expr:right };
    if(xLike(right) && !this.containsVar(left,"x")) return { type:"x-of-y", expr:left };

    const paramM = text.match(/^x\s*\(\s*([A-Za-z])\s*\)\s*=\s*(.+?)\s*[,;]\s*y\s*\(\s*([A-Za-z])\s*\)\s*=\s*(.+)$/i);
    if(paramM) return { type:"parametric", fx:paramM[2].trim(), fy:paramM[4].trim() };

    return { type:"implicit", lhs:left, rhs:right };
  },

  containsVar(expr, v){
    const re = new RegExp(`(^|[^A-Za-z0-9_])${v}([^A-Za-z0-9_]|$)`);
    return re.test(expr);
  },

  /* ---------------------------- history ------------------------------- */

  pushHistory(){
    if(this.suppressHistory) return;
    try{
      this.history.push(JSON.stringify(this.state));
      if(this.history.length>60) this.history.shift();
      this.future = [];
    }catch(_){}
  },
  pushHistoryDebounced(){
    clearTimeout(this._histTimer);
    this._histTimer = setTimeout(()=>this.pushHistory(), 350);
  },
  undo(){
    if(this.history.length<2) return;
    const current = this.history.pop();
    this.future.push(current);
    this.suppressHistory = true;
    this.state = JSON.parse(this.history[this.history.length-1]);
    this.suppressHistory = false;
    this.render();
  },
  redo(){
    if(!this.future.length) return;
    const next = this.future.pop();
    this.history.push(next);
    this.suppressHistory = true;
    this.state = JSON.parse(next);
    this.suppressHistory = false;
    this.render();
  },

  /* --------------------- parameter animation ticker ------------------- */

  _animRaf:null,
  _animRunning:false,
  _animLast:0,

  ensureAnimationTicker(){
    if(this._animRunning) return;
    this._animRunning = true;
    this._animLast = performance.now();

    const tick = (now)=>{
      const anims = this.state.parameterAnimations || {};
      const dt = Math.min(0.1, Math.max(0, (now - this._animLast)/1000));
      this._animLast = now;

      let running = false;
      let changed = false;

      for(const id of Object.keys(anims)){
        const anim = anims[id];
        if(!anim || anim.paused) continue;

        const expr = this.state.expressions.find(x=>x.id===id);
        const param = (expr && expr.parameters) ? expr.parameters[anim.name] : null;

        if(!param){ delete anims[id]; continue; }

        const min = Number(anim.min), max = Number(anim.max);
        if(!Number.isFinite(min) || !Number.isFinite(max) || min >= max){
          anim.paused = true;
          UI.refreshParameterPlayButton(id, anim.name);
          continue;
        }

        let value = Number(param.value);
        if(!Number.isFinite(value)) value = anim.direction > 0 ? min : max;

        value += anim.direction * anim.speed * dt;

        if(value >= max){ value = max; anim.direction = -1; }
        else if(value <= min){ value = min; anim.direction = 1; }

        param.value = value;
        UI.setParameterControlValue(id, anim.name, value);

        running = true;
        changed = true;
      }

      if(changed) Graph.request();

      if(running){
        this._animRaf = requestAnimationFrame(tick);
      } else {
        this._animRunning = false;
        this._animRaf = null;
      }
    };

    this._animRaf = requestAnimationFrame(tick);
  },

  stopAnimationTicker(){
    if(this._animRaf !== null){
      cancelAnimationFrame(this._animRaf);
      this._animRaf = null;
    }
    this._animRunning = false;
  },

  stopAllParameterAnimations(){
    const anims = this.state.parameterAnimations || {};
    Object.keys(anims).forEach(id=>{
      const anim = anims[id];
      if(anim) anim.paused = true;
      if(anim) UI.refreshParameterPlayButton(id, anim.name);
    });
    this.stopAnimationTicker();
    Graph.request();
  },

  startConfiguredAnimations(configs){
    if(!Array.isArray(configs) || !configs.length) return false;
    if(!this.state.parameterAnimations) this.state.parameterAnimations = {};

    const startedIds = [];

    configs.forEach(cfg=>{
      const e = this.state.expressions.find(x=>x.id===cfg.id);
      if(!e || !e.parameters || !e.parameters[cfg.name]) return;

      const p = e.parameters[cfg.name];
      let min = Number(p.min), max = Number(p.max);
      let speed = Number(cfg.speed);

      if(!Number.isFinite(min) || !Number.isFinite(max) || min === max) return;
      if(min > max){ const t = min; min = max; max = t; }
      if(!Number.isFinite(speed) || speed <= 0) return;

      p.min = min; p.max = max; p.value = min;

      this.state.parameterAnimations[e.id] = {
        name:cfg.name, min, max, speed, direction:1, paused:false
      };
      startedIds.push(e.id);
    });

    if(!startedIds.length) return false;

    startedIds.forEach(id=>{
      const anim = this.state.parameterAnimations[id];
      const e = this.state.expressions.find(x=>x.id===id);
      UI.setParameterControlValue(id, anim.name, e && e.parameters && e.parameters[anim.name] ? e.parameters[anim.name].value : NaN);
      UI.refreshParameterPlayButton(id, anim.name);
    });

    this.ensureAnimationTicker();
    Graph.request();
    return true;
  },

  showAnimationDialog(){ UI.showAnimationSetupDialog(); },

  /* -------------------------- export ---------------------------------- */

  showExportDialog(){
    const min = Graph.screenToWorld(0, Graph.height);
    const max = Graph.screenToWorld(Graph.width, 0);
    const r = v => Number(v.toFixed(3));

    UI.dialog("Export PNG", `
      <p style="margin:0 0 4px;color:var(--muted);font-size:13px">
        Enter the axis ranges you want printed in the exported image:
      </p>
      <div class="range-grid">
        <label class="range-field">X FROM<input id="expXmin" type="number" step="any" value="${r(min.x)}"></label>
        <label class="range-field">X TO<input id="expXmax" type="number" step="any" value="${r(max.x)}"></label>
        <label class="range-field">Y FROM<input id="expYmin" type="number" step="any" value="${r(min.y)}"></label>
        <label class="range-field">Y TO<input id="expYmax" type="number" step="any" value="${r(max.y)}"></label>
      </div>
      <div class="export-note">A legend with each curve's colour and label is drawn in the top-left corner of the PNG.</div>
      <div class="export-error" id="expErr"></div>
      <div class="dialog-actions">
        <button class="topbtn" style="background:var(--accent);color:#fff;border-color:var(--accent)"
                onclick="App.exportPNG()">Download PNG</button>
      </div>
    `);
  },

  exportPNG(){
    const val = id => { const el = document.getElementById(id); return el ? parseFloat(el.value) : NaN; };
    const xmin = val("expXmin"), xmax = val("expXmax");
    const ymin = val("expYmin"), ymax = val("expYmax");
    const errEl = document.getElementById("expErr");
    const fail = m => { if(errEl) errEl.textContent = m; else alert(m); };

    if(![xmin,xmax,ymin,ymax].every(Number.isFinite)) return fail("Please enter a number in every field.");
    if(xmax <= xmin) return fail("X FROM must be smaller than X TO.");
    if(ymax <= ymin) return fail("Y FROM must be smaller than Y TO.");
    if(errEl) errEl.textContent = "";

    const saved = {
      canvas:Graph.canvas, ctx:Graph.ctx,
      width:Graph.width, height:Graph.height,
      scale:Graph.scale, scaleY:Graph.scaleY,
      ox:Graph.ox, oy:Graph.oy,
      trace:App.state.trace
    };

    const DPR = 2;
    const W = Math.max(320, Math.round(saved.width || 1000));
    const H = Math.max(240, Math.round(saved.height || 700));

    const off = document.createElement("canvas");
    off.width = Math.round(W*DPR);
    off.height = Math.round(H*DPR);
    const octx = off.getContext("2d");
    octx.setTransform(DPR,0,0,DPR,0,0);

    try{
      Graph._exporting = true;
      Graph.canvas = off; Graph.ctx = octx;
      Graph.width = W; Graph.height = H;
      Graph.scale = W/(xmax-xmin);
      Graph.scaleY = H/(ymax-ymin);
      Graph.ox = -xmin*Graph.scale;
      Graph.oy = ymax*Graph.scaleY;
      App.state.trace = false;

      try{ Graph._draw(); }catch(e){ console.error(e); }

      const items = App.state.expressions
        .filter(e=>e.visible && e.text.trim())
        .map(e=>({ color:e.color, label:e.label, expr:e.text.trim() }));

      App.drawExportLegend(octx, W, H, items);
    }finally{
      Graph.canvas = saved.canvas; Graph.ctx = saved.ctx;
      Graph.width = saved.width; Graph.height = saved.height;
      Graph.scale = saved.scale; Graph.scaleY = saved.scaleY;
      Graph.ox = saved.ox; Graph.oy = saved.oy;
      Graph._exporting = false;
      App.state.trace = saved.trace;
      Graph.request();
    }

    const name = "ganith_x[" + safeFileName(xmin) + "_" + safeFileName(xmax) +
                 "]_y[" + safeFileName(ymin) + "_" + safeFileName(ymax) + "].png";
    const download = url => {
      const a = document.createElement("a");
      a.download = name; a.href = url;
      document.body.appendChild(a); a.click(); a.remove();
    };

    if(off.toBlob){
      off.toBlob(blob=>{
        if(!blob){ download(off.toDataURL("image/png")); return; }
        const url = URL.createObjectURL(blob);
        download(url);
        setTimeout(()=>URL.revokeObjectURL(url), 5000);
      }, "image/png");
    } else {
      download(off.toDataURL("image/png"));
    }

    document.getElementById("dialogBackdrop").classList.remove("show");
    UI.status("PNG exported · X [" + xmin + ", " + xmax + "] · Y [" + ymin + ", " + ymax + "]");
  },

  drawExportLegend(ctx, W, H, items){
    if(!items.length) return;
    const padX = 13, padY = 11, rowH = 22, swatch = 11, gap = 9;
    const fontLabel = '600 13px Inter, "Segoe UI", Arial, sans-serif';

    let contentW = 0;
    items.forEach(it=>{
      ctx.font = fontLabel;
      contentW = Math.max(contentW, swatch + gap + ctx.measureText(it.label).width);
    });

    const boxW = Math.min(contentW + padX*2, W-28);
    const boxH = items.length*rowH + padY*2;
    const bx = 14, by = 14;

    ctx.save();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,0.93)";
    ctx.strokeStyle = "#d5ddea";
    ctx.lineWidth = 1;
    roundRectPath(ctx, bx, by, boxW, boxH, 9);
    ctx.fill(); ctx.stroke();

    items.forEach((it,i)=>{
      const cy = by + padY + i*rowH + rowH/2;
      ctx.fillStyle = it.color;
      ctx.beginPath();
      ctx.arc(bx + padX + swatch/2, cy, swatch/2, 0, Math.PI*2);
      ctx.fill();
      ctx.font = fontLabel;
      ctx.fillStyle = "#182235";
      ctx.fillText(it.label, bx + padX + swatch + gap, cy);
    });
    ctx.restore();
  }
};

/* ========================== FUNCTION LIBRARY =========================== */

const FunctionLibrary = {
  toggle(button){
    const group = button.closest(".function-group");
    if(!group) return;
    group.classList.toggle("open");
    const span = group.querySelector("span");
    if(span){
      const label = span.textContent.replace(/^▸|^▾/,"").trim();
      span.textContent = (group.classList.contains("open") ? "▾ " : "▸ ") + label;
    }
  },

  insert(value){
    let input = document.querySelector(".expr-input:focus");
    if(!input && App.state.selected){
      input = document.querySelector(`.expr-input[data-id="${cssEscape(App.state.selected)}"]`);
    }
    if(!input){
      const all = document.querySelectorAll(".expr-input");
      input = all.length ? all[all.length-1] : null;
    }

    if(!input){ App.addExpression(value); return; }

    const start = input.selectionStart != null ? input.selectionStart : input.value.length;
    const end = input.selectionEnd != null ? input.selectionEnd : input.value.length;
    const before = input.value.slice(0,start);
    const after = input.value.slice(end);
    let insertion = value;

    const constants = ["pi","e","phi","tau","Infinity","alpha","beta","theta","lambda","mu","sigma","omega","delta"];
    if(constants.includes(value) && /[0-9A-Za-z_)πφτθ]$/.test(before)){
      insertion = "*" + value;
    }

    input.value = before + insertion + after;
    input.dispatchEvent(new Event("input", { bubbles:true }));
    input.focus();
    const pos = start + insertion.length;
    try{ input.setSelectionRange(pos, pos); }catch(_){}
    App.state.selected = input.dataset.id;
    Graph.request();
  }
};

        const s = input.selectionStart, ep = input.selectionEnd;

        const val = input.value;
        const before = val.slice(0, s);

            ev.preventDefault();
            const nv = val.slice(0, s-1) + val.slice(s);
