      card.addEventListener("click", ev=>{
        if(ev.target.closest("button,input,select,textarea,output,label,.expression-parameter-control,.expression-parameter-add")) return;
        App.state.selected = e.id;
        document.querySelectorAll(".expr-card").forEach(c=>c.classList.remove("selected"));
        card.classList.add("selected");
      });

      list.appendChild(card);
      UI.applyExpressionMeta(card, e);
    });
  },

  applyExpressionMeta(card, e){
    const badge = card.querySelector(".expr-type-badge");
    const errEl = card.querySelector(".expr-error-text");
    if(!badge || !errEl) return;

    if(!e.text.trim()){
      badge.textContent = "empty";
      badge.className = "expr-type-badge";
      errEl.textContent = "";
      card.classList.remove("has-error");
      return;
    }

    let cls, err = "";
    try{
      cls = App.classifyExpression(e.text);
      err = Graph.validateExpression(e.text, cls);
    }catch(ex){
      cls = { type:"error" };
      err = ex && ex.message ? ex.message : "Parse error";
    }

    if(err){
      badge.textContent = cls.type || "error";
      badge.className = "expr-type-badge";
      errEl.textContent = err;
      card.classList.add("has-error");
    } else {
      badge.textContent = UI.typeLabel(cls.type);
      badge.className = "expr-type-badge ok";
      errEl.textContent = "";
      card.classList.remove("has-error");
    }
  },

  typeLabel(t){
    const map = {
      "y-of-x":"explicit", "x-of-y":"inverse", "implicit":"implicit",
      "polar":"polar", "parametric":"parametric", "point":"point",
      "points":"point list", "inequality":"inequality", "sequence":"sequence",
      "fndef":"function def", "assignment":"variable", "complex":"complex",
      "vector":"vector", "segment":"segment", "circle":"circle",
      "polygon":"polygon", "pointFn":"point", "slopefield":"slope field",
      "regression":"regression", "table":"table", "empty":"empty", "invalid":"invalid"
    };
    return map[t] || t;
  },

  renderExpressionParameterControls(e){
    if(!e.parameters) return "";
    const items = Object.entries(e.parameters)
      .filter(([name,p])=>p && p.onScreen)
      .map(([name,p])=>{
        let min = Number(p.min), max = Number(p.max), value = Number(p.value);
        if(!Number.isFinite(min)) min = -10;
        if(!Number.isFinite(max)) max = 10;
        if(min === max) max = min+1;
        if(min > max){ const t = min; min = max; max = t; }
        if(!Number.isFinite(value)) value = min;
        value = Math.min(max, Math.max(min, value));

        const animState = App.state.parameterAnimations ? App.state.parameterAnimations[e.id] : null;
        const isPlaying = Boolean(animState && !animState.paused && animState.name === name);

        return `
          <div class="expression-parameter-control"
               data-expression-id="${e.id}"
               data-parameter-name="${escapeHtml(name)}">
            <div class="expression-parameter-head">
              <span class="expression-parameter-name">${escapeHtml(name)}</span>
              <output class="expression-parameter-value">${formatParameterValue(value)}</output>
              <div class="expression-parameter-actions">
                <button class="parameter-edit-btn" type="button" title="Edit range and value"
                        onclick="UI.toggleParameterEdit('${e.id}','${escapeJs(name)}')">✎ Edit</button>
                <button class="parameter-play-btn" type="button"
                        title="${isPlaying ? "Pause parameter animation" : "Play continuously from minimum to maximum"}"
                        onclick="UI.toggleParameterPlayback('${e.id}','${escapeJs(name)}')">
                  ${isPlaying ? "Ⅱ Pause" : "▶ Play"}
                </button>
              </div>
            </div>

            <div class="parameter-inline-editor" hidden>
              <div class="parameter-inline-editor-grid">
                <label><span>MIN</span><input class="parameter-edit-min" type="number" inputmode="decimal" step="any" value="${min}"></label>
                <label><span>MAX</span><input class="parameter-edit-max" type="number" inputmode="decimal" step="any" value="${max}"></label>
                <label><span>VALUE</span><input class="parameter-edit-value" type="number" inputmode="decimal" step="any" value="${value}"></label>
                <button class="parameter-save-btn" type="button"
                        onclick="UI.saveParameterEdit('${e.id}','${escapeJs(name)}',this)">Save</button>
              </div>
            </div>

            <div class="expression-parameter-slider-row">
              <span class="expression-parameter-min">${formatParameterValue(min)}</span>
              <input class="expression-parameter-slider" type="range" min="${min}" max="${max}" step="any" value="${value}"
                     oninput="UI.screenParameterSliderChange('${e.id}','${escapeJs(name)}',this)">
              <span class="expression-parameter-max">${formatParameterValue(max)}</span>
            </div>
          </div>
        `;
      }).join("");

    return items;
  },

  toggleParameterEdit(id, name){
    const control = this.getParameterControl(id, name);
    if(!control) return;
    const editor = control.querySelector(".parameter-inline-editor");
    const button = control.querySelector(".parameter-edit-btn");
    if(!editor) return;
    const open = editor.hidden;
    editor.hidden = !open;
    if(button) button.textContent = open ? "✕ Close" : "✎ Edit";
    if(open){
      const input = editor.querySelector(".parameter-edit-min");
      if(input){
        try{ input.focus({preventScroll:true}); }catch(_){ input.focus(); }
      }
    }
  },

  saveParameterEdit(id, name, button){
    const e = App.state.expressions.find(x=>x.id===id);
    if(!e || !e.parameters || !e.parameters[name]) return;

    const control = button.closest(".expression-parameter-control");
    if(!control) return;

    let min = parseFloat(control.querySelector(".parameter-edit-min")?.value);
    let max = parseFloat(control.querySelector(".parameter-edit-max")?.value);
    let value = parseFloat(control.querySelector(".parameter-edit-value")?.value);

    if(!Number.isFinite(min) || !Number.isFinite(max)){ alert("Enter valid minimum and maximum values."); return; }
    if(min === max){ alert("MIN and MAX must be different."); return; }
    if(min > max){ const t = min; min = max; max = t; }
    if(!Number.isFinite(value)) value = min;
    value = Math.min(max, Math.max(min, value));

    this.stopParameterAnimation(id);

    e.parameters[name].min = min;
    e.parameters[name].max = max;
    e.parameters[name].value = value;

    App.pushHistory();
    App.render();
  },

  getParameterControl(id, name){
    try{
      return document.querySelector(
        '.expression-parameter-control[data-expression-id="'+cssEscape(id)+'"]' +
        '[data-parameter-name="'+cssEscape(name)+'"]'
      );
    }catch(_){ return null; }
  },

  setParameterControlValue(id, name, value){
    const control = this.getParameterControl(id, name);
    if(!control) return;
    const slider = control.querySelector(".expression-parameter-slider");
    const output = control.querySelector(".expression-parameter-value");
    if(slider) slider.value = value;
    if(output) output.textContent = formatParameterValue(value);
  },

  refreshParameterPlayButton(id, name){
    const control = this.getParameterControl(id, name);
    if(!control) return;
    const play = control.querySelector(".parameter-play-btn");
    if(!play) return;
    const anim = App.state.parameterAnimations ? App.state.parameterAnimations[id] : null;
    const playing = Boolean(anim && anim.name === name && !anim.paused);
    play.textContent = playing ? "Ⅱ Pause" : "▶ Play";
    play.title = playing ? "Pause parameter animation" : "Play continuously from minimum to maximum";
    play.disabled = false;
    this.refreshAnimationButton();
  },

  toggleParameterPlayback(id, name){
    const active = App.state.parameterAnimations ? App.state.parameterAnimations[id] : null;

    if(active && active.name === name){
      if(active.paused) this.playParameter(id, name);
      else this.pauseParameterAnimation(id);
      return;
    }
    if(active && active.name !== name){
      const lbl = (App.state.expressions.find(x=>x.id===id) || {}).label || "this expression";
      alert(`Only one parameter can move at a time for "${lbl}".\n\nParameter "${active.name}" is currently moving.`);
      return;
    }
    this.playParameter(id, name);
  },

  playParameter(id, name){
    const e = App.state.expressions.find(x=>x.id===id);
    if(!e || !e.parameters || !e.parameters[name]) return;
    const p = e.parameters[name];

    let min = Number(p.min), max = Number(p.max);
    if(!Number.isFinite(min) || !Number.isFinite(max) || min === max){
      alert("Set a valid MIN and MAX range first.");
      return;
    }
    if(min > max){ const t = min; min = max; max = t; }

    if(!App.state.parameterAnimations) App.state.parameterAnimations = {};

    const existing = App.state.parameterAnimations[id];
    let animation;

    if(existing && existing.name === name){
      animation = existing;
      animation.min = min; animation.max = max;
      animation.paused = false;
      let currentValue = Number(p.value);
      if(!Number.isFinite(currentValue)) currentValue = min;
      p.value = Math.min(max, Math.max(min, currentValue));
    } else {
      const speedAnswer = prompt(`Speed for parameter "${name}"\n\nEnter speed in units per second:`, "1");
      if(speedAnswer === null) return;
      const speed = parseFloat(speedAnswer);
      if(!Number.isFinite(speed) || speed <= 0){
        alert("Speed must be greater than 0 units per second.");
        return;
      }
      p.value = min;
      animation = { name, min, max, speed, direction:1, paused:false };
      App.state.parameterAnimations[id] = animation;
    }

    this.setParameterControlValue(id, name, p.value);
    this.refreshParameterPlayButton(id, name);
    Graph.request();
    App.ensureAnimationTicker();
  },

  pauseParameterAnimation(id){
    const animation = App.state.parameterAnimations ? App.state.parameterAnimations[id] : null;
    if(!animation) return;
    animation.paused = true;
    this.refreshParameterPlayButton(id, animation.name);
    this.refreshAnimationButton();
    Graph.request();
  },

  stopParameterAnimation(id){
    const animation = App.state.parameterAnimations ? App.state.parameterAnimations[id] : null;
    if(!animation) return;
    const name = animation.name;
    delete App.state.parameterAnimations[id];
    this.refreshParameterPlayButton(id, name);
    this.refreshAnimationButton();
    if(!Object.keys(App.state.parameterAnimations || {}).length){
      App.stopAnimationTicker();
    }
  },

  screenParameterSliderChange(id, name, input){
    const e = App.state.expressions.find(x=>x.id===id);
    if(!e || !e.parameters || !e.parameters[name]) return;
    const value = parseFloat(input.value);
    if(!Number.isFinite(value)) return;

    const animation = App.state.parameterAnimations ? App.state.parameterAnimations[id] : null;
    if(animation && animation.name === name && !animation.paused){
      animation.paused = true;
    }

    e.parameters[name].value = value;
    this.setParameterControlValue(id, name, value);
    this.refreshParameterPlayButton(id, name);
    Graph.request();
  },

  toggleParameterOnScreen(id, name){
    const e = App.state.expressions.find(x=>x.id===id);
    if(!e || !e.parameters) return;
    const p = e.parameters[name];
    if(!p) return;
    p.onScreen = !p.onScreen;
    App.pushHistory();
    App.render();
    UI.showParameters(e);
  },

  /* -------------------------- animation dialog ------------------------ */

  showAnimationSetupDialog(){
    const expressions = App.state.expressions.filter(e=>e.text.trim());
    if(!expressions.length){
      UI.dialog("Animation", `<div class="animation-empty">Add at least one expression with a parameter before starting animation.</div>`);
      return;
    }

    const existing = App.state.parameterAnimations || {};

    const rows = expressions.map(e=>{
      const parameters = Object.keys(e.parameters || {});
      const active = existing[e.id];
      const activeName = active && parameters.includes(active.name) ? active.name : (parameters[0] || "");
      const activeSpeed = active && Number.isFinite(Number(active.speed)) ? Number(active.speed) : 1;

      const parameterOptions = parameters.length
        ? parameters.map(name=>`<option value="${escapeHtml(name)}" ${name===activeName?"selected":""}>${escapeHtml(name)}</option>`).join("")
        : "";

      return `
        <div class="animation-expression-row ${parameters.length ? "" : "disabled"}" data-animation-expression="${escapeHtml(e.id)}">
          <div class="animation-expression-head">
            <input class="animation-expression-check" type="checkbox" ${parameters.length ? "checked" : "disabled"}
                   aria-label="Animate ${escapeHtml(e.label)}">
            <div class="animation-expression-name">
              <span class="animation-expression-dot" style="background:${e.color}"></span>
              <span>${escapeHtml(e.label)}</span>
            </div>
            <div class="animation-expression-equation" title="${escapeHtml(e.text)}">${escapeHtml(e.text)}</div>
          </div>
          ${parameters.length ? `
            <div class="animation-config-grid">
              <label><span>PARAMETER TO MOVE</span><select class="animation-parameter-select">${parameterOptions}</select></label>
              <label><span>SPEED / SECOND</span><input class="animation-speed-input" type="number" min="0.000001" step="any" inputmode="decimal" value="${activeSpeed}"></label>
            </div>
          ` : `<div class="animation-no-parameter">No parameter is available for this expression. Add a parameter first.</div>`}
        </div>
      `;
    }).join("");

    UI.dialog("Animation Setup", `
      <div class="animation-dialog">
        <p class="animation-dialog-intro">
          Select the expressions you want to animate. For each selected expression,
          choose <b>one parameter only</b> and set its individual speed.
          All selected animations start together when you press <b>Start All Animation</b>.
        </p>
        <div class="animation-list" id="animationSetupList">${rows}</div>
        <div class="animation-dialog-actions">
          <span class="animation-selection-count" id="animationSelectionCount">0 selected</span>
          <div style="display:flex;gap:7px;align-items:center">
            <button type="button" class="animation-start-btn" id="animationStartAllBtn">▶ Start All Animation</button>
          </div>
        </div>
      </div>
    `);

    const list = document.getElementById("animationSetupList");
    if(!list) return;

    const updateRow = row=>{
      const check = row.querySelector(".animation-expression-check");
      const controls = row.querySelectorAll("select,input[type=number]");
      row.classList.toggle("disabled", !check || !check.checked);
      controls.forEach(el=>el.disabled = !check || !check.checked);
    };

    const updateCount = ()=>{
      const count = list.querySelectorAll(".animation-expression-check:checked").length;
      const el = document.getElementById("animationSelectionCount");
      if(el) el.textContent = count + " selected";
    };

    list.querySelectorAll(".animation-expression-row").forEach(row=>{
      const check = row.querySelector(".animation-expression-check");
      if(check){
        check.addEventListener("change", ()=>{ updateRow(row); updateCount(); });
        updateRow(row);
      }
    });
    updateCount();

    document.getElementById("animationStartAllBtn").onclick = ()=>{
      const configs = [];
      let error = "";

      list.querySelectorAll(".animation-expression-row").forEach(row=>{
        const check = row.querySelector(".animation-expression-check");
        if(!check || !check.checked) return;
        const id = row.dataset.animationExpression;
        const select = row.querySelector(".animation-parameter-select");
        const speedInput = row.querySelector(".animation-speed-input");
        const name = select ? select.value : "";
        const speed = speedInput ? Number(speedInput.value) : NaN;

        if(!name){ error = "Every selected expression must have one parameter selected."; return; }
        if(!Number.isFinite(speed) || speed <= 0){
          error = "Enter a speed greater than 0 for the selected expression.";
          return;
        }
        configs.push({ id, name, speed });
      });

      if(error){ alert(error); return; }
      if(!configs.length){ alert("Select at least one expression to animate."); return; }

      const started = App.startConfiguredAnimations(configs);
      if(!started){ alert("No valid animations could be started. Check the selected parameters and ranges."); return; }

      App.state.animating = true;
      UI.refreshAnimationButton();
      document.getElementById("dialogBackdrop").classList.remove("show");
    };
  },

  refreshAnimationButton(){
    const btn = document.getElementById("animateBtn");
    if(!btn) return;
    const anyRunning = Object.values(App.state.parameterAnimations || {}).some(a=>a && !a.paused);
    btn.textContent = anyRunning ? "❚❚ Animation" : "▶ Animation";
    btn.classList.toggle("active", anyRunning);
  },

  renderLegend(){
    const legendEl = document.getElementById("legend");
    if(!legendEl) return;
    legendEl.innerHTML = "";
    App.state.expressions.forEach(e=>{
      if(!e.visible || !e.text.trim()) return;
      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `<span class="legend-color" style="background:${e.color}"></span><span>${escapeHtml(e.label)}</span>`;
      legendEl.appendChild(item);
    });
  },

  /* -------------------------- parameters ------------------------------ */

  addExpressionParameter(id, name, minValue, maxValue, valueValue){
    const e = App.state.expressions.find(x=>x.id===id);
    if(!e) return false;
    if(!e.parameters) e.parameters = {};

    name = String(name||"").trim();
    if(!/^[A-Za-z]$/.test(name)){
      alert("Use one letter for a parameter: a, b, c, k, m, etc.");
      return false;
    }
    name = name.toLowerCase();

    const reserved = new Set([...FUNCTION_TOKENS, ...CONSTANT_NAMES, "x","y","t","z","r","n"]);
    if(reserved.has(name)){
      alert(`"${name}" is reserved and cannot be used as a parameter.`);
      return false;
    }
    if(Object.prototype.hasOwnProperty.call(e.parameters, name)){
      alert(`Parameter "${name}" is already added to this expression.`);
      return false;
    }

    let min = parseFloat(minValue), max = parseFloat(maxValue), value = parseFloat(valueValue);
    if(!Number.isFinite(min)) min = -10;
    if(!Number.isFinite(max)) max = 10;
    if(min === max) max = min+1;
    if(min > max){ const t = min; min = max; max = t; }
    if(!Number.isFinite(value)) value = min;
    value = Math.min(max, Math.max(min, value));

    e.parameters[name] = { min, max, value, onScreen:true };
    App.pushHistory();
    App.render();
    Graph.request();
    return true;
  },

  showParameters(e){
    if(!e.parameters) e.parameters = {};
    const vars = detectVariables(e.text);

    vars.forEach(name=>{
      if(!e.parameters[name]){
        e.parameters[name] = { min:-10, max:10, value:1, onScreen:false };
      }
    });

    const parameterNames = [...new Set([...vars, ...Object.keys(e.parameters)])];

    const rows = parameterNames.length
      ? parameterNames.map(name=>{
          const p = e.parameters[name] || { min:-10, max:10, value:1, onScreen:false };
          let min = Number.isFinite(Number(p.min)) ? Number(p.min) : -10;
          let max = Number.isFinite(Number(p.max)) ? Number(p.max) : 10;
          let value = Number.isFinite(Number(p.value)) ? Number(p.value) : 1;
          if(min === max) max = min+1;
          if(min > max){ const t = min; min = max; max = t; }
          value = Math.min(max, Math.max(min, value));
          e.parameters[name] = { min, max, value, onScreen: p.onScreen };

          return `
            <div class="parameter-row" data-parameter="${escapeHtml(name)}">
              <div class="parameter-row-head">
                <div class="parameter-name">
                  <span class="parameter-symbol">${escapeHtml(name)}</span>
                  <span class="parameter-use">${vars.includes(name) ? "Used in expression" : "Added parameter"}</span>
                </div>
                <button class="parameter-remove" type="button" title="Remove parameter"
                        onclick="UI.removeParameter('${e.id}','${escapeJs(name)}')">×</button>
              </div>
              <div class="parameter-range-grid">
                <label><span>MIN</span><input class="parameter-min" type="number" step="any" value="${min}"
                       oninput="UI.parameterRangeChange('${e.id}','${escapeJs(name)}',this,'min')"></label>
                <label><span>MAX</span><input class="parameter-max" type="number" step="any" value="${max}"
                       oninput="UI.parameterRangeChange('${e.id}','${escapeJs(name)}',this,'max')"></label>
                <div class="parameter-screen-option">
                  <span>SCREEN CONTROL</span>
                  <button class="add-screen-parameter ${p.onScreen ? "active" : ""}" type="button"
                          onclick="UI.toggleParameterOnScreen('${e.id}','${escapeJs(name)}')">
                    ${p.onScreen ? "✓ On Screen" : "＋ Add to screen"}
                  </button>
                </div>
              </div>
              <div class="parameter-slider-line">
                <input class="parameter-slider" type="range" min="${min}" max="${max}" step="any" value="${value}"
                       oninput="UI.parameterSliderChange('${e.id}','${escapeJs(name)}',this)">
                <output class="parameter-output">${formatParameterValue(value)}</output>
              </div>
            </div>
          `;
        }).join("")
      : `<div class="parameter-empty"><strong>No parameter detected yet.</strong><span>Add a parameter below, then use the same name in the equation.</span></div>`;

    const body = `
      <div class="parameter-editor">
        <p class="parameter-intro">Set a range for each parameter and move the slider to change the graph live.</p>
        <div class="parameter-list">${rows}</div>
        <div class="add-parameter-box">
          <div class="add-parameter-title">＋ Add Parameter</div>
          <div class="add-parameter-grid">
            <label><span>NAME</span><input id="newParameterName" type="text" placeholder="a" autocomplete="off"></label>
            <label><span>MIN</span><input id="newParameterMin" type="number" step="any" value="-10"></label>
            <label><span>MAX</span><input id="newParameterMax" type="number" step="any" value="10"></label>
            <label><span>VALUE</span><input id="newParameterValue" type="number" step="any" value="1"></label>
            <button class="add-parameter-action" type="button" onclick="UI.addParameterFromDialog('${e.id}')">Add Parameter</button>
          </div>
          <div class="parameter-help">Example: <b>y = x² + a</b> → add <b>a</b> → move its slider.</div>
        </div>
      </div>
    `;

    this.dialog("Parameters", body);
  },

  parameterRangeChange(id, name, input, which){
    const e = App.state.expressions.find(x=>x.id===id);
    if(!e) return;
    if(!e.parameters) e.parameters = {};
    if(!e.parameters[name]) e.parameters[name] = { min:-10, max:10, value:1 };

    const n = parseFloat(input.value);
    if(!Number.isFinite(n)) return;
    e.parameters[name][which] = n;

    let min = Number(e.parameters[name].min), max = Number(e.parameters[name].max);
    if(min === max){ if(which === "min") min = max-1; else max = min+1; }
    if(min > max){ const t = min; min = max; max = t; }
    e.parameters[name].min = min;
    e.parameters[name].max = max;

    let value = Number(e.parameters[name].value);
    value = Math.min(max, Math.max(min, value));
    e.parameters[name].value = value;

    const row = input.closest(".parameter-row");
    if(row){
      const slider = row.querySelector(".parameter-slider");
      const output = row.querySelector(".parameter-output");
      if(slider){ slider.min = min; slider.max = max; slider.value = value; }
      if(output) output.textContent = formatParameterValue(value);
    }
    Graph.request();
  },

  parameterSliderChange(id, name, input){
    const e = App.state.expressions.find(x=>x.id===id);
    if(!e) return;
    if(!e.parameters) e.parameters = {};
    if(!e.parameters[name]) e.parameters[name] = { min:-10, max:10, value:1 };

    const value = parseFloat(input.value);
    if(!Number.isFinite(value)) return;
    e.parameters[name].value = value;

    const row = input.closest(".parameter-row");
    if(row){
      const output = row.querySelector(".parameter-output");
      if(output) output.textContent = formatParameterValue(value);
    }
    Graph.request();
  },

  addParameterFromDialog(id){
    const e = App.state.expressions.find(x=>x.id===id);
    if(!e) return;
    if(!e.parameters) e.parameters = {};

    const nameEl = document.getElementById("newParameterName");
    const minEl = document.getElementById("newParameterMin");
    const maxEl = document.getElementById("newParameterMax");
    const valueEl = document.getElementById("newParameterValue");

    const name = (nameEl ? nameEl.value : "").trim();
    if(!/^[A-Za-z_]\w*$/.test(name)){
      alert("Enter a valid parameter name, for example: a, b, k or theta.");
      if(nameEl) nameEl.focus();
      return;
    }

    const reserved = new Set([...FUNCTION_TOKENS, ...CONSTANT_NAMES, "x","y","t","z","r","n"]);
    if(reserved.has(name)){
      alert(`"${name}" is reserved and cannot be used as a parameter.`);
      if(nameEl) nameEl.focus();
      return;
    }

    let min = parseFloat(minEl ? minEl.value : NaN);
    let max = parseFloat(maxEl ? maxEl.value : NaN);
    let value = parseFloat(valueEl ? valueEl.value : NaN);

    if(!Number.isFinite(min)) min = -10;
    if(!Number.isFinite(max)) max = 10;
    if(min === max) max = min+1;
    if(min > max){ const t = min; min = max; max = t; }
    if(!Number.isFinite(value)) value = min;
    value = Math.min(max, Math.max(min, value));

    e.parameters[name] = { min, max, value, onScreen:false };
    App.pushHistory();
    UI.showParameters(e);
    Graph.request();
  },

  removeParameter(id, name){
    const e = App.state.expressions.find(x=>x.id===id);
    if(!e || !e.parameters) return;
    delete e.parameters[name];
    App.pushHistory();
    UI.showParameters(e);
    Graph.request();
  },

  /* --------------------------- value table ---------------------------- */

  showTable(e){
    const cls = App.classifyExpression(e.text);
    let html = "";

    const buildRows = (headers, rows)=>{
      return `<table class="data-table"><thead><tr>${
        headers.map(h=>`<th>${escapeHtml(h)}</th>`).join("")
      }</tr></thead><tbody>${
        rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join("")}</tr>`).join("")
      }</tbody></table>`;
    };

    if(cls.type === "y-of-x"){
      const rows = [];
      for(let i=-10;i<=10;i++){
        const x = i;
        const y = Graph.evalExpr(cls.expr, { x }, e);
        rows.push([String(x), Number.isFinite(y) ? y.toFixed(4) : "—"]);
      }
      html = buildRows(["x", e.label], rows);
    } else if(cls.type === "x-of-y"){
      const rows = [];
      for(let i=-10;i<=10;i++){
        const y = i;
        const x = Graph.evalExpr(cls.expr, { y }, e);
        rows.push([String(y), Number.isFinite(x) ? x.toFixed(4) : "—"]);
      }
      html = buildRows(["y", "x"], rows);
    } else if(cls.type === "polar"){
      const rows = [];
      for(let i=0;i<=12;i++){
        const th = i*Math.PI/6;
        const r = Graph.evalExpr(cls.expr, { theta:th, t:th }, e);
        rows.push([ (i*30)+"°", Number.isFinite(r) ? r.toFixed(4) : "—" ]);
      }
      html = buildRows(["θ", "r"], rows);
    } else if(cls.type === "sequence"){
      const rows = [];
      for(let n=1;n<=20;n++){
        const v = Graph.evalExpr(cls.expr, { [cls.index]: n, n }, e);
        rows.push([String(n), Number.isFinite(v) ? v.toFixed(4) : "—"]);
      }
      html = buildRows([cls.index, cls.name+"_"+cls.index], rows);
    } else if(cls.type === "parametric"){
      const rows = [];
      for(let i=0;i<=12;i++){
        const t = -3 + i*0.5;
        const x = Graph.evalExpr(cls.fx, { t }, e);
        const y = Graph.evalExpr(cls.fy, { t }, e);
        rows.push([ t.toFixed(2),
                    Number.isFinite(x) ? x.toFixed(4) : "—",
                    Number.isFinite(y) ? y.toFixed(4) : "—" ]);
      }
      html = buildRows(["t", "x(t)", "y(t)"], rows);
    } else {
      html = `<div class="animation-empty">A value table is available for explicit, inverse, polar, parametric and sequence expressions.</div>`;
    }

    UI.dialog("Value Table · " + e.label, html);
  },

/* ============================ AUTOCOMPLETE ============================= */

const Autocomplete = {
  el:null,
  items:[],
  activeIndex:-1,
  targetInput:null,

  ensureEl(){
    if(!this.el) this.el = document.getElementById("autocomplete");
    return this.el;
  },

  buildCatalog(){
    const cat = [];
    FUNCTION_TOKENS.forEach(t=>cat.push({ name:t, insert:t+"(", kind:"function" }));
    CONSTANT_NAMES.forEach(c=>cat.push({ name:c, insert:c, kind:"constant" }));
    cat.push({ name:"x", insert:"x", kind:"variable" });
    cat.push({ name:"y", insert:"y", kind:"variable" });
    cat.push({ name:"t", insert:"t", kind:"variable" });
    cat.push({ name:"n", insert:"n", kind:"variable" });
    cat.push({ name:"theta", insert:"theta", kind:"variable" });
    return cat;
  },

  attach(input){
    this.targetInput = input;
  },

  currentWord(input){
    const pos = input.selectionStart != null ? input.selectionStart : input.value.length;
    const before = input.value.slice(0, pos);
    const m = before.match(/[A-Za-z_][A-Za-z_0-9]*$/);
    return m ? m[0] : "";
  },

  update(input){
    const el = this.ensureEl();
    if(!el) return;
    const word = this.currentWord(input);
    if(!word || word.length < 1){ this.hide(); return; }

    const lower = word.toLowerCase();
    const catalog = this.buildCatalog();

    const params = [];
    if(App.state.selected){
      const e = App.state.expressions.find(x=>x.id===App.state.selected);
      if(e && e.parameters){
        Object.keys(e.parameters).forEach(n=>params.push({ name:n, insert:n, kind:"parameter" }));
      }
      if(e){
        detectVariables(e.text).forEach(n=>{
          if(!params.some(p=>p.name===n)) params.push({ name:n, insert:n, kind:"parameter" });
        });
      }
    }

    const all = params.concat(catalog);
    const matches = all.filter(it=>it.name.toLowerCase().startsWith(lower) && it.name.toLowerCase() !== lower);
    if(!matches.length){ this.hide(); return; }

    this.items = matches.slice(0, 12);
    this.activeIndex = 0;
    this.targetInput = input;

    el.innerHTML = this.items.map((it,i)=>
      `<div class="autocomplete-item ${i===0?"active":""}" data-index="${i}">
        <code>${escapeHtml(it.name)}</code><small>${escapeHtml(it.kind)}</small>
      </div>`
    ).join("");

    const rect = input.getBoundingClientRect();
    el.style.left = rect.left + "px";
    el.style.top = (rect.bottom + 4) + "px";
    el.style.minWidth = Math.max(180, rect.width) + "px";
    el.classList.add("show");

    el.querySelectorAll(".autocomplete-item").forEach(node=>{
      node.addEventListener("mousedown", ev=>{
        ev.preventDefault();
        this.pick(parseInt(node.dataset.index, 10));
      });
    });
  },

  handleKey(ev){
    const el = this.ensureEl();
    if(!el || !el.classList.contains("show")) return false;

    if(ev.key === "ArrowDown"){
      ev.preventDefault();
      this.activeIndex = Math.min(this.items.length-1, this.activeIndex+1);
      this.highlight();
      return true;
    }
    if(ev.key === "ArrowUp"){
      ev.preventDefault();
      this.activeIndex = Math.max(0, this.activeIndex-1);
      this.highlight();
      return true;
    }
    if(ev.key === "Enter" || ev.key === "Tab"){
      if(this.activeIndex >= 0){
        ev.preventDefault();
        this.pick(this.activeIndex);
        return true;
      }
    }
    if(ev.key === "Escape"){ this.hide(); return false; }
    return false;
  },

  highlight(){
    const el = this.ensureEl();
    if(!el) return;
    el.querySelectorAll(".autocomplete-item").forEach((node,i)=>{
      node.classList.toggle("active", i === this.activeIndex);
    });
  },

  pick(index){
    const input = this.targetInput;
    if(!input) return;
    const item = this.items[index];
    if(!item){ this.hide(); return; }

    const pos = input.selectionStart != null ? input.selectionStart : input.value.length;
    const before = input.value.slice(0, pos);
    const after = input.value.slice(pos);
    const word = this.currentWord(input);

    const newBefore = before.slice(0, before.length - word.length) + item.insert;
    input.value = newBefore + after;
    input.dispatchEvent(new Event("input", { bubbles:true }));
    input.focus();
    const newPos = newBefore.length;
    try{ input.setSelectionRange(newPos, newPos); }catch(_){}

    this.hide();
  },

  hide(){
    const el = this.ensureEl();
    if(el) el.classList.remove("show");
    this.items = [];
    this.activeIndex = -1;
  }
};

/* =============================== GRAPH ================================= */

const Graph = {
  canvas:null, ctx:null, width:0, height:0, scale:50, scaleY:50, ox:0, oy:0,
  dragging:false, lastX:0, lastY:0, pointerX:0, pointerY:0, raf:0,
  _compiledCache:new Map(),
  _exporting:false,
  activePointers:new Map(),
  _lastPinchDist:null,
  _originSet:false,
  _resizeTries:0,

  init(){
    this.canvas = document.getElementById("graph");
    this.ctx = this.canvas.getContext("2d");

    this.resize();

    window.addEventListener("resize", ()=>this.resize());
    window.addEventListener("orientationchange", ()=>setTimeout(()=>this.resize(), 250));
    if(window.visualViewport){
      try{ window.visualViewport.addEventListener("resize", ()=>this.resize()); }catch(_){}
    }
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) this.resize(); });

    this.canvas.addEventListener("wheel", e=>this.wheel(e), { passive:false });

    this.canvas.addEventListener("pointerdown", e=>this.down(e));
    window.addEventListener("pointermove", e=>this.move(e));
    window.addEventListener("pointerup", e=>this.up(e));
    window.addEventListener("pointercancel", e=>this.up(e));

    this.canvas.addEventListener("dblclick", e=>this.doubleClick(e));
    this.canvas.addEventListener("pointerleave", ()=>{
      const c = document.getElementById("coords");
      if(c) c.textContent = "X: — Y: —";
    });

    if(typeof ResizeObserver !== "undefined"){
      try{
        const target = this.canvas.parentElement || this.canvas;
        new ResizeObserver(()=>this.resize()).observe(target);
      }catch(_){}
    }

    /* last-resort safety net: keep nudging until we have a real size */
    const watchdog = setInterval(()=>{
      if(this.width >= 10 && this.height >= 10){ clearInterval(watchdog); return; }
      this.resize();
    }, 250);
    setTimeout(()=>clearInterval(watchdog), 8000);
  },

  /* ------------ ROBUST SIZING (this was the main bug) ------------ */
  resize(){
    const canvas = this.canvas;
    if(!canvas) return;

    let w = 0, h = 0;

    try{
      const r = canvas.getBoundingClientRect();
      w = r.width; h = r.height;
    }catch(_){}

    if(w < 10 || h < 10){
      const parent = canvas.parentElement;
      if(parent){
        w = parent.clientWidth || 0;
        h = parent.clientHeight || 0;
        if(w < 10 || h < 10){
          try{
            const pr = parent.getBoundingClientRect();
            w = pr.width || w; h = pr.height || h;
          }catch(_){}
        }
      }
    }

    if(w < 10 || h < 10){
      /* absolute last resort — compute from the window */
      const topbar = document.querySelector(".topbar");
      const bottombar = document.querySelector(".bottom");
      const sidebar = document.getElementById("sidebar");
      const sidebarVisible = sidebar && window.innerWidth > 900 &&
                              !document.querySelector(".main").classList.contains("collapsed");
      const sbw = sidebarVisible ? (sidebar.offsetWidth || 360) : 0;
      w = window.innerWidth - sbw;
      h = window.innerHeight - ((topbar ? topbar.offsetHeight : 54) + (bottombar ? bottombar.offsetHeight : 48));
    }

    if(w < 10 || h < 10){
      /* still no layout — retry next frame (max 30 times) */
      if(this._resizeTries < 30){
        this._resizeTries++;
        requestAnimationFrame(()=>this.resize());
      }
      return;
    }

    this._resizeTries = 0;

    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

    const prevW = this.width, prevH = this.height;
    this.width = w;
    this.height = h;

    canvas.width  = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if(!this._originSet){
      this.ox = w/2;
      this.oy = h/2;
      this._originSet = true;
    } else if(prevW > 0 && prevH > 0){
      /* keep the same world point at the centre when the panel resizes */
      this.ox += (w - prevW)/2;
      this.oy += (h - prevH)/2;
    }

    this.request();
  },

  origin(){ this.ox = this.width/2; this.oy = this.height/2; this._originSet = true; this.request(); },
  reset(){ this.scale = 50; this.scaleY = 50; this.origin(); },

  request(){
    if(this._exporting) return;
    cancelAnimationFrame(this.raf);
    this.raf = requestAnimationFrame(()=>this.draw());
  },

  worldToScreen(x,y){ return { x:this.ox + x*this.scale, y:this.oy - y*this.scaleY }; },
  screenToWorld(px,py){ return { x:(px-this.ox)/this.scale, y:(this.oy-py)/this.scaleY }; },

  zoom(factor, centerX, centerY){
    if(centerX === null || centerX === undefined) centerX = this.width/2;
    if(centerY === null || centerY === undefined) centerY = this.height/2;
    const before = this.screenToWorld(centerX, centerY);

    const MIN = 1e-15, MAX = 1e15;
    const nextScale = this.scale * factor;
    const nextScaleY = this.scaleY * factor;

    this.scale = Number.isFinite(nextScale)
      ? Math.min(MAX, Math.max(MIN, nextScale))
      : (factor > 1 ? MAX : MIN);
    this.scaleY = Number.isFinite(nextScaleY)
      ? Math.min(MAX, Math.max(MIN, nextScaleY))
      : (factor > 1 ? MAX : MIN);

    const after = this.screenToWorld(centerX, centerY);
    this.ox += (after.x - before.x) * this.scale;
    this.oy -= (after.y - before.y) * this.scaleY;
    this.request();
  },

  wheel(e){
    e.preventDefault();
    const rect = this.canvas.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const factor = Math.exp(-e.deltaY * .0018);
    this.zoom(factor, px, py);
  },

  down(e){
    this.activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(this.activePointers.size === 1){
      this.dragging = true;
      this.lastX = e.clientX; this.lastY = e.clientY;
    }
    if(this.canvas.setPointerCapture) this.canvas.setPointerCapture(e.pointerId);
  },

  move(e){
    const rect = this.canvas.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const wpt = this.screenToWorld(px, py);
    const coordsEl = document.getElementById("coords");
    if(coordsEl) coordsEl.textContent = `X: ${wpt.x.toFixed(3)} Y: ${wpt.y.toFixed(3)}`;

    this.pointerX = px; this.pointerY = py;

    if(this.activePointers.has(e.pointerId)){
      this.activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    }

    if(this.activePointers.size === 2){
      const pointers = Array.from(this.activePointers.values());
      const p1 = pointers[0], p2 = pointers[1];
      const dist = Math.hypot(p1.x-p2.x, p1.y-p2.y);
      if(this._lastPinchDist){
        const factor = dist / this._lastPinchDist;
        if(Math.abs(factor - 1) > 0.01){
          const cx = (p1.x + p2.x)/2 - rect.left;
          const cy = (p1.y + p2.y)/2 - rect.top;
          this.zoom(factor, cx, cy);
        }
      }
      this._lastPinchDist = dist;
      this.dragging = false;
      return;
    }

    if(!this.dragging) return;
    const dx = e.clientX - this.lastX, dy = e.clientY - this.lastY;
    this.ox += dx; this.oy += dy;
    this.lastX = e.clientX; this.lastY = e.clientY;
    this.request();
  },

  up(e){
    this.activePointers.delete(e.pointerId);
    if(this.activePointers.size < 2) this._lastPinchDist = null;
    if(this.activePointers.size === 0) this.dragging = false;
  },

  doubleClick(e){
    const rect = this.canvas.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    this.zoom(1.5, px, py);
  },

  fitAll(){ this.reset(); },

  /* --------------------------- compilation ---------------------------- */

  getCompiled(raw){
    const key = raw;
    if(this._compiledCache.has(key)) return this._compiledCache.get(key);

    let entry;
    try{
      const normalized = normalizeFunctionAdjacency(preprocessText(raw));
      const node = math.parse(normalized);
      if(treeHasSpecial(node)){
        entry = { kind:"tree", node };
      } else {
        entry = { kind:"compiled", eval: node.compile() };
      }
    }catch(err){
      entry = { kind:"error", error: err && err.message ? err.message : "Parse error" };
    }
    this._compiledCache.set(key, entry);
    return entry;
  },

  validateExpression(raw, cls){
    if(!raw.trim()) return "";

    /*
      Validate the mathematical parts, not the complete equation string.
      math.js treats a bare '=' as an assignment operator, but in a graphing
      calculator '=' means equality and variables may appear on either side:
      y^2=x, x=y^2, x+y=3, x^2=y^2, etc.
    */
    const partsToValidate = [];
    const type = cls && cls.type;
    if(type === "implicit" || type === "inequality"){
      partsToValidate.push(cls.lhs, cls.rhs);
    } else if(["y-of-x","x-of-y","polar","complex"].includes(type)){
      partsToValidate.push(cls.expr);
    } else if(type === "fndef" || type === "assignment" || type === "sequence"){
      partsToValidate.push(cls.expr);
    } else {
      partsToValidate.push(raw);
    }

    const scope = Object.assign({}, App.buildGlobalScope(), {
      x:1, y:1, t:1, theta:1, n:1, r:1, z:1,
      pi:Math.PI, e:Math.E, phi:(1+Math.sqrt(5))/2, tau:2*Math.PI
    });
    for(const part of partsToValidate){
      if(part == null || !String(part).trim()) continue;
      const entry = this.getCompiled(String(part));
      if(entry.kind === "error") return entry.error || "Syntax error";
      try{
        if(entry.kind === "compiled") entry.eval.evaluate(scope);
        else evalNode(entry.node, scope);
      }catch(err){
        return err && err.message ? err.message : "Evaluation error";
      }
    }
    return "";
  },

  evalExpr(expr, scope, expression){
    const entry = this.getCompiled(expr);
    if(!entry || entry.kind === "error") return NaN;

    const parameterScope = {};
    if(expression && expression.parameters){
      for(const name of Object.keys(expression.parameters)){
        const p = expression.parameters[name];
        const v = Number(p ? p.value : NaN);
        if(!Number.isFinite(v)) return NaN;
        parameterScope[name] = v;
      }
    }

    const fullScope = Object.assign(
      {},
      App.buildGlobalScope(),
      parameterScope,
      scope,
      {
        t: App.state.t,
        pi: Math.PI, e: Math.E,
        phi: (1+Math.sqrt(5))/2, tau: 2*Math.PI,
        gammaConst: 0.5772156649015329
      }
    );

    try{
      if(entry.kind === "compiled") return Number(entry.eval.evaluate(fullScope));
      return Number(evalNode(entry.node, fullScope));
    }catch(_){ return NaN; }
  },

  containsVar(expr, v){
    const re = new RegExp(`(^|[^A-Za-z0-9_])${v}([^A-Za-z0-9_]|$)`);
    return re.test(expr);
  },

  classifyExpression(text){ return App.classifyExpression(text); },

  /* ----------------------------- drawing ------------------------------ */

  draw(){
    try{
      this._draw();
    }catch(err){
      console.error("GANITH render error:", err);
      const s = document.getElementById("status");
      if(s) s.textContent = "Render error: " + (err && err.message ? err.message : err);
    }
  },

  _draw(){
    /* if the canvas still has no size, fix it and bail out for this frame */
    if(this.width < 10 || this.height < 10){
      this.resize();
      if(this.width < 10 || this.height < 10) return;
    }

    const ctx = this.ctx, w = this.width, h = this.height;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "#fbfcfe";
    ctx.fillRect(0,0,w,h);

    if(App.state.mode === "polar") this.drawPolarGrid();
    if(App.state.mode === "complex") this.drawComplexGrid();

    this.drawGrid();
    this.drawAxes();

    this.drawExpressions();

    this.drawObjects();
    if(App.state.trace) this.drawTrace();

    const modePill = document.getElementById("modePill");
    if(modePill){
      modePill.textContent =
        (App.state.mode[0].toUpperCase() + App.state.mode.slice(1)) + " · " +
        (App.state.angleMode === "rad" ? "Radians" : "Degrees");
    }
  },

  drawExpressions(){
    const min = this.screenToWorld(0, this.height);
    const max = this.screenToWorld(this.width, 0);

    App.state.expressions.forEach(e=>{
      if(!e.visible) return;
      if(!e.text.trim()) return;

      let cls;
      try{ cls = this.classifyExpression(e.text); }catch(_){ return; }

      try{
        switch(cls.type){
          case "y-of-x":     this.plotYofX(e, cls.expr, min, max); break;
          case "x-of-y":     this.plotXofY(e, cls.expr, min, max); break;
          case "implicit":   this.plotImplicit(e, cls.lhs, cls.rhs); break;
          case "polar":      this.plotPolarExpr(e, cls.expr); break;
          case "parametric": this.plotParametricExpr(e, cls.fx, cls.fy); break;
          case "point":      this.plotPoint(e, cls.x, cls.y); break;
          case "points":     cls.points.forEach(p=>this.plotPointExpr(e, p)); break;
          case "inequality": this.plotInequality(e, cls.lhs, cls.op, cls.rhs); break;
          case "sequence":   this.plotSequence(e, cls.index, cls.expr); break;
          case "vector":     this.plotVector(e, e.text); break;
          case "segment":    this.plotSegment(e, e.text); break;
          case "circle":     this.plotCircle(e, e.text); break;
          case "polygon":    this.plotPolygon(e, e.text); break;
          case "pointFn":    this.plotPointFn(e, e.text); break;
          case "slopefield": this.plotSlopeField(e, e.text); break;
          case "regression": this.plotRegression(e, e.text); break;
          case "complex":    this.plotComplex(e, cls.expr); break;
          case "fndef":      this.plotYofX(e, e.text.split("=").slice(1).join("="), min, max); break;
          case "assignment": break;
        }
      }catch(err){
        console.error("GANITH plot error for expression:", e.text, err);
      }
    });
  },

  drawGrid(){
    const ctx = this.ctx, w = this.width, h = this.height;
    const stepX = this.gridStep(this.scale);
    const stepY = this.gridStep(this.scaleY);
    if(!Number.isFinite(stepX) || stepX <= 0) return;
    if(!Number.isFinite(stepY) || stepY <= 0) return;

    const min = this.screenToWorld(0, h);
    const max = this.screenToWorld(w, 0);

    ctx.lineWidth = 1;
    ctx.strokeStyle = "#e1e7f0";
    ctx.beginPath();
    for(let x = Math.floor(min.x/stepX)*stepX; x <= max.x; x += stepX){
      const p = this.worldToScreen(x, 0);
      ctx.moveTo(Math.round(p.x)+.5, 0);
      ctx.lineTo(Math.round(p.x)+.5, h);
    }
    for(let y = Math.floor(min.y/stepY)*stepY; y <= max.y; y += stepY){
      const p = this.worldToScreen(0, y);
      ctx.moveTo(0, Math.round(p.y)+.5);
      ctx.lineTo(w, Math.round(p.y)+.5);
    }
    ctx.stroke();

    ctx.fillStyle = "#738198";
    ctx.font = "11px Segoe UI";
    for(let x = Math.floor(min.x/stepX)*stepX; x <= max.x; x += stepX){
      if(Math.abs(x) < stepX*.01) continue;
      const p = this.worldToScreen(x, 0);
      if(p.x > 4 && p.x < w-20) ctx.fillText(formatTick(x), p.x+3, Math.min(h-5, Math.max(12, p.y+14)));
    }
    for(let y = Math.floor(min.y/stepY)*stepY; y <= max.y; y += stepY){
      if(Math.abs(y) < stepY*.01) continue;
      const p = this.worldToScreen(0, y);
      if(p.y > 12 && p.y < h-5) ctx.fillText(formatTick(y), p.x+7, p.y-3);
    }
  },

  gridStep(scale){
    const s = scale || this.scale || 50;
    if(!Number.isFinite(s) || s <= 0) return 1;
    const raw = 70/s;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw/p;
    return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
  },

  drawAxes(){
    const ctx = this.ctx, w = this.width, h = this.height;
    ctx.strokeStyle = "#7a879b"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, this.oy+.5); ctx.lineTo(w, this.oy+.5);
    ctx.moveTo(this.ox+.5, 0); ctx.lineTo(this.ox+.5, h);
    ctx.stroke();
    ctx.fillStyle = "#66758d";
    ctx.font = "12px Segoe UI";
    if(this.ox > 5 && this.ox < w-15) ctx.fillText("y", this.ox+7, 15);
    if(this.oy > 15 && this.oy < h-5) ctx.fillText("x", w-15, this.oy-7);
  },

  drawPolarGrid(){
    const ctx = this.ctx;
    const cx = this.ox, cy = this.oy;
    const maxR = Math.max(this.width, this.height);
    ctx.save();
    ctx.strokeStyle = "#e5ebf3"; ctx.lineWidth = 1;
    const ratio = this.scaleY / this.scale;
    const stepR = this.gridStep() * this.scale;
    for(let r = stepR; r < maxR; r += stepR){
      ctx.beginPath();
      ctx.ellipse(cx, cy, r, r*ratio, 0, 0, Math.PI*2);
      ctx.stroke();
    }
    for(let a = 0; a < Math.PI*2; a += Math.PI/12){
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + maxR*Math.cos(a), cy - maxR*Math.sin(a));
      ctx.stroke();
    }
    ctx.restore();
  },

  drawComplexGrid(){
    const ctx = this.ctx;
    ctx.save();
    ctx.strokeStyle = "#eef2f8";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x = this.ox; x < this.width; x += 50) { ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,this.height); }
    for(let x = this.ox; x > 0; x -= 50) { ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,this.height); }
    for(let y = this.oy; y < this.height; y += 50) { ctx.moveTo(0,y+.5); ctx.lineTo(this.width,y+.5); }
    for(let y = this.oy; y > 0; y -= 50) { ctx.moveTo(0,y+.5); ctx.lineTo(this.width,y+.5); }
    ctx.stroke();
    ctx.fillStyle = "#a3aec2";
    ctx.font = "10px Segoe UI";
    ctx.fillText("Re", this.width-30, this.oy-8);
    ctx.fillText("Im", this.ox+8, 14);
    ctx.restore();
  },

  /* ------------------------- individual plots ------------------------- */

  plotYofX(e, expr, min, max){
    const ctx = this.ctx;
    ctx.strokeStyle = e.color; ctx.lineWidth = 2.4; ctx.beginPath();
    let started = false, lastPy = null;
    const samples = Math.min(6000, Math.max(1200, Math.floor(this.width*2)));
    const jumpLimit = Math.max(40, this.height * 1.2);
    for(let i = 0; i <= samples; i++){
      const x = min.x + (max.x - min.x) * i / samples;
      const y = this.evalExpr(expr, { x }, e);
      const valid = Number.isFinite(y) && Math.abs(y) < 1e9;
      if(!valid){ started = false; lastPy = null; continue; }
      const p = this.worldToScreen(x, y);
      if(lastPy !== null && Math.abs(p.y - lastPy) > jumpLimit){ started = false; }
      if(!started){ ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
      lastPy = p.y;
    }
    ctx.stroke();
  },

  plotXofY(e, expr, min, max){
    const ctx = this.ctx;
    ctx.strokeStyle = e.color; ctx.lineWidth = 2.4; ctx.beginPath();
    let started = false, lastPx = null;
    const samples = Math.min(6000, Math.max(1200, Math.floor(this.height*2)));
    const jumpLimit = Math.max(40, this.width * 1.2);
    for(let i = 0; i <= samples; i++){
      const y = min.y + (max.y - min.y) * i / samples;
      const x = this.evalExpr(expr, { y }, e);
      const valid = Number.isFinite(x) && Math.abs(x) < 1e9;
      if(!valid){ started = false; lastPx = null; continue; }
      const p = this.worldToScreen(x, y);
      if(lastPx !== null && Math.abs(p.x - lastPx) > jumpLimit){ started = false; }
      if(!started){ ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
      lastPx = p.x;
    }
    ctx.stroke();
  },

  plotImplicit(e, lhs, rhs){
    const fullExpr = `(${lhs})-(${rhs})`;
    const compiled = this.getCompiled(fullExpr);
    if(!compiled || compiled.kind === "error") return;

    const paramScope = {};
    if(e.parameters){
      for(const name of Object.keys(e.parameters)){
        const v = Number(e.parameters[name] ? e.parameters[name].value : NaN);
        if(!Number.isFinite(v)) return;
        paramScope[name] = v;
      }
    }

    const baseScope = Object.assign({}, App.buildGlobalScope(), paramScope, {
      pi:Math.PI, e:Math.E, phi:(1+Math.sqrt(5))/2, tau:2*Math.PI, t:App.state.t
    });

    const F = (x,y)=>{
      try{
        const sc = Object.assign({}, baseScope, { x, y });
        if(compiled.kind === "compiled") return Number(compiled.eval.evaluate(sc));
        return Number(evalNode(compiled.node, sc));
      }catch(_){ return NaN; }
    };

    const PX_PER_CELL = 4;
    const step = Math.max(0.001, PX_PER_CELL / this.scale);
    const min = this.screenToWorld(0, this.height);
    const max = this.screenToWorld(this.width, 0);

    const ctx = this.ctx;
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    const startX = Math.floor(min.x/step)*step;
    const startY = Math.floor(min.y/step)*step;

    const cellsX = Math.floor((max.x - startX)/step);
    const cellsY = Math.floor((max.y - startY)/step);
    if(cellsX * cellsY > 1400000){ ctx.lineCap = "butt"; return; }

    for(let x = startX; x < max.x; x += step){
      for(let y = startY; y < max.y; y += step){
        const a = F(x, y);
        const b = F(x+step, y);
        const c = F(x+step, y+step);
        const d = F(x, y+step);
        if(!Number.isFinite(a) || !Number.isFinite(b) ||
           !Number.isFinite(c) || !Number.isFinite(d)) continue;

        const pts = [];
        if((a>=0) !== (b>=0)) pts.push(interpolate(x,     y,     x+step, y,      a, b));
        if((b>=0) !== (c>=0)) pts.push(interpolate(x+step,y,     x+step, y+step, b, c));
        if((c>=0) !== (d>=0)) pts.push(interpolate(x+step,y+step,x,      y+step, c, d));
        if((d>=0) !== (a>=0)) pts.push(interpolate(x,     y+step,x,      y,      d, a));

        if(pts.length >= 2){
          const p1 = this.worldToScreen(pts[0].x, pts[0].y);
          const p2 = this.worldToScreen(pts[1].x, pts[1].y);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
    }

    ctx.lineCap = "butt";
    ctx.lineJoin = "miter";
  },

  plotInequality(e, lhs, op, rhs){
    const ctx = this.ctx;

    let boundary = null, dir = null;
    const lhsT = lhs.trim(), rhsT = rhs.trim();

    if(lhsT === "y" && !this.containsVar(rhsT, "y")){
      boundary = rhsT;
      dir = (op === "<" || op === "<=") ? "below" : "above";
    } else if(rhsT === "y" && !this.containsVar(lhsT, "y")){
      boundary = lhsT;
      dir = (op === "<" || op === "<=") ? "above" : "below";
    } else if(lhsT === "x" && !this.containsVar(rhsT, "x")){
      boundary = rhsT;
      dir = (op === "<" || op === "<=") ? "left" : "right";
    } else if(rhsT === "x" && !this.containsVar(lhsT, "x")){
      boundary = lhsT;
      dir = (op === "<" || op === "<=") ? "right" : "left";
    }

    if(boundary !== null){
      ctx.save();
      ctx.fillStyle = hexToRgba(e.color, 0.16);
      if(dir === "below" || dir === "above"){
        const samples = Math.max(200, Math.floor(this.width));
        const cols = [];
        for(let i = 0; i <= samples; i++){
          const px = (i/samples) * this.width;
          const wx = this.screenToWorld(px, 0).x;
          const wy = this.evalExpr(boundary, { x:wx }, e);
          cols.push(Number.isFinite(wy) ? this.worldToScreen(wx, wy).y : NaN);
        }
        for(let i = 0; i < samples; i++){
          const y0 = cols[i], y1 = cols[i+1];
          if(!Number.isFinite(y0) && !Number.isFinite(y1)) continue;
          const ya = Number.isFinite(y0) ? y0 : y1;
          const yb = Number.isFinite(y1) ? y1 : y0;
          const px0 = (i/samples)*this.width;
          const px1 = ((i+1)/samples)*this.width;
          const top = Math.min(ya, yb), bot = Math.max(ya, yb);
          if(dir === "below"){
            ctx.fillRect(px0, bot, px1-px0, Math.max(0, this.height - bot));
          } else {
            ctx.fillRect(px0, 0, px1-px0, Math.max(0, top));
          }
        }
      } else {
        const samples = Math.max(200, Math.floor(this.height));
        for(let i = 0; i < samples; i++){
          const py = (i/samples)*this.height;
          const wy = this.screenToWorld(0, py).y;
          const wx = this.evalExpr(boundary, { y:wy }, e);
          if(!Number.isFinite(wx)) continue;
          const px = this.worldToScreen(wx, wy).x;
          const py1 = ((i+1)/samples)*this.height;
          if(dir === "left"){
            ctx.fillRect(0, py, Math.max(0, px), py1-py);
          } else {
            ctx.fillRect(px, py, Math.max(0, this.width - px), py1-py);
          }
        }
      }
      ctx.restore();

      if(dir === "below" || dir === "above"){
        this.plotYofX(e, boundary, this.screenToWorld(0,this.height), this.screenToWorld(this.width,0));
      } else {
        this.plotXofY(e, boundary, this.screenToWorld(0,this.height), this.screenToWorld(this.width,0));
      }
      return;
    }

    const step = 6;
    ctx.save();
    ctx.fillStyle = hexToRgba(e.color, 0.18);
    for(let px = 0; px < this.width; px += step){
      for(let py = 0; py < this.height; py += step){
        const wp = this.screenToWorld(px, py);
        const l = this.evalExpr(lhs, { x:wp.x, y:wp.y }, e);
        const r = this.evalExpr(rhs, { x:wp.x, y:wp.y }, e);
        if(!Number.isFinite(l) || !Number.isFinite(r)) continue;
        let ok = false;
        switch(op){
          case "<": ok = l < r; break;
          case ">": ok = l > r; break;
          case "<=": ok = l <= r; break;
          case ">=": ok = l >= r; break;
        }
        if(ok) ctx.fillRect(px, py, step, step);
      }
    }
    ctx.restore();
    this.plotImplicit(e, lhs, rhs);
  },

  plotPolarExpr(e, expr){
    const ctx = this.ctx;
    ctx.strokeStyle = e.color; ctx.lineWidth = 2.4; ctx.beginPath();
    let started = false;
    const N = 2400;
    for(let i = 0; i <= N; i++){
      const th = -Math.PI*4 + Math.PI*8*i/N;
      const r = this.evalExpr(expr, { theta:th, t:th, x:th }, e);
      if(!Number.isFinite(r)){ started = false; continue; }
      const p = this.worldToScreen(r*Math.cos(th), r*Math.sin(th));
      if(!started){ ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  },

  plotParametricExpr(e, fx, fy){
    const ctx = this.ctx;
    ctx.strokeStyle = e.color; ctx.lineWidth = 2.4; ctx.beginPath();
    let started = false;
    const N = 2000;
    for(let i = 0; i <= N; i++){
      const t = -10 + 20*i/N;
      const x = this.evalExpr(fx, { t }, e);
      const y = this.evalExpr(fy, { t }, e);
      if(!Number.isFinite(x) || !Number.isFinite(y)){ started = false; continue; }
      const p = this.worldToScreen(x, y);
      if(!started){ ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  },

  plotPoint(e, xE, yE){
    const x = this.evalExpr(xE, {}, e);
    const y = this.evalExpr(yE, {}, e);
    if(!Number.isFinite(x) || !Number.isFinite(y)) return;
    this.drawPointMarker(e, x, y);
  },

  plotPointExpr(e, pStr){
    const m = pStr.match(/^\(\s*(.*?)\s*,\s*(.*?)\s*\)$/);
    if(!m) return;
    const x = this.evalExpr(m[1], {}, e);
    const y = this.evalExpr(m[2], {}, e);
    if(!Number.isFinite(x) || !Number.isFinite(y)) return;
    this.drawPointMarker(e, x, y);
  },

  drawPointMarker(e, x, y){
    const ctx = this.ctx;
    const p = this.worldToScreen(x, y);
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = e.color;
    ctx.font = "11px Inter, sans-serif";
    ctx.fillText(e.label, p.x+9, p.y-8);
  },

  plotPointFn(e, text){
    const m = text.match(/^point\s*\(\s*([^,()]+)\s*,\s*([^,()]+)\s*\)$/i);
    if(!m) return;
    this.plotPoint(e, m[1], m[2]);
  },

  plotSequence(e, indexName, expr){
    const ctx = this.ctx;
    ctx.strokeStyle = hexToRgba(e.color, 0.35);
    ctx.lineWidth = 1.2;
    for(let n = 1; n <= 40; n++){
      const v = this.evalExpr(expr, { [indexName]: n, n }, e);
      if(!Number.isFinite(v)) continue;
      const p = this.worldToScreen(n, v);
      const base = this.worldToScreen(n, 0);
      ctx.beginPath();
      ctx.moveTo(p.x, base.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    ctx.fillStyle = e.color;
    for(let n = 1; n <= 40; n++){
      const v = this.evalExpr(expr, { [indexName]: n, n }, e);
      if(!Number.isFinite(v)) continue;
      const p = this.worldToScreen(n, v);
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI*2); ctx.fill();
    }
  },

  plotVector(e, text){
    const m = text.match(/^(?:vector|arrow)\s*\(\s*\(\s*([^,)]+)\s*,\s*([^,)]+)\s*\)\s*,\s*\(\s*([^,)]+)\s*,\s*([^,)]+)\s*\)\s*\)$/i);
    if(!m) return;
    const x1 = this.evalExpr(m[1], {}, e), y1 = this.evalExpr(m[2], {}, e);
    const x2 = this.evalExpr(m[3], {}, e), y2 = this.evalExpr(m[4], {}, e);
    if(![x1,y1,x2,y2].every(Number.isFinite)) return;
    this.drawArrow(e, x1, y1, x2, y2);
  },

  drawArrow(e, x1, y1, x2, y2){
    const ctx = this.ctx;
    const a = this.worldToScreen(x1, y1), b = this.worldToScreen(x2, y2);
    ctx.strokeStyle = e.color; ctx.fillStyle = e.color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    const ang = Math.atan2(b.y-a.y, b.x-a.x);
    const L = 12;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - L*Math.cos(ang-0.4), b.y - L*Math.sin(ang-0.4));
    ctx.lineTo(b.x - L*Math.cos(ang+0.4), b.y - L*Math.sin(ang+0.4));
    ctx.closePath(); ctx.fill();
  },

  plotSegment(e, text){
    const m = text.match(/^segment\s*\(\s*\(\s*([^,)]+)\s*,\s*([^,)]+)\s*\)\s*,\s*\(\s*([^,)]+)\s*,\s*([^,)]+)\s*\)\s*\)$/i);
    if(!m) return;
    const x1 = this.evalExpr(m[1], {}, e), y1 = this.evalExpr(m[2], {}, e);
    const x2 = this.evalExpr(m[3], {}, e), y2 = this.evalExpr(m[4], {}, e);
    if(![x1,y1,x2,y2].every(Number.isFinite)) return;
    const ctx = this.ctx;
    const a = this.worldToScreen(x1, y1), b = this.worldToScreen(x2, y2);
    ctx.strokeStyle = e.color; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    [a,b].forEach(p=>{
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
    });
  },

  plotCircle(e, text){
    const m = text.match(/^circle\s*\(\s*\(\s*([^,)]+)\s*,\s*([^,)]+)\s*\)\s*,\s*(.+)\s*\)$/i);
    if(!m) return;
    const cx = this.evalExpr(m[1], {}, e);
    const cy = this.evalExpr(m[2], {}, e);
    const r = this.evalExpr(m[3], {}, e);
    if(![cx,cy,r].every(Number.isFinite)) return;
    const ctx = this.ctx;
    const q = this.worldToScreen(cx, cy);
    ctx.strokeStyle = e.color; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.ellipse(q.x, q.y, Math.abs(r)*this.scale, Math.abs(r)*this.scaleY, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, 4, 0, Math.PI*2); ctx.fill();
  },

  plotPolygon(e, text){
    const m = text.match(/^polygon\s*\(\s*(.+)\s*\)$/i);
    if(!m) return;
    const inner = m[1];
    const pts = [];
    const re = /\(\s*([^,()]+)\s*,\s*([^,()]+)\s*\)/g;
    let mm;
    while((mm = re.exec(inner))){
      const x = this.evalExpr(mm[1], {}, e);
      const y = this.evalExpr(mm[2], {}, e);
      if(Number.isFinite(x) && Number.isFinite(y)) pts.push([x,y]);
    }
    if(pts.length < 3) return;
    const ctx = this.ctx;
    ctx.strokeStyle = e.color; ctx.lineWidth = 2.4;
    ctx.fillStyle = hexToRgba(e.color, 0.15);
    ctx.beginPath();
    pts.forEach((p,i)=>{
      const s = this.worldToScreen(p[0], p[1]);
      if(i===0) ctx.moveTo(s.x, s.y);
      else ctx.lineTo(s.x, s.y);
    });
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  },

  plotSlopeField(e, text){
    const m = text.match(/^(?:slopeField|field)\s*\(\s*(.+)\s*\)$/i);
    if(!m) return;
    const expr = m[1];
    const ctx = this.ctx;
    const step = 30;
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 1.6;
    ctx.globalAlpha = 0.8;

    for(let px = step/2; px < this.width; px += step){
      for(let py = step/2; py < this.height; py += step){
        const wp = this.screenToWorld(px, py);
        const slope = this.evalExpr(expr, { x:wp.x, y:wp.y }, e);
        if(!Number.isFinite(slope)) continue;
        const ang = Math.atan2(-slope * this.scaleY, this.scale);
        const L = step * 0.42;
        const dx = Math.cos(ang) * L;
        const dy = Math.sin(ang) * L;
        ctx.beginPath();
        ctx.moveTo(px - dx, py - dy);
        ctx.lineTo(px + dx, py + dy);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  },

  plotRegression(e, text){
    const m = text.match(/^fit\s*\(\s*\[(.*)\]\s*(?:,\s*(\d+)\s*)?\)$/i);
    if(!m) return;
    const inner = m[1];
    const degree = m[2] ? parseInt(m[2], 10) : 1;
    const pts = [];
    const re = /\(\s*([^,()]+)\s*,\s*([^,()]+)\s*\)/g;
    let mm;
    while((mm = re.exec(inner))){
      const x = this.evalExpr(mm[1], {}, e);
      const y = this.evalExpr(mm[2], {}, e);
      if(Number.isFinite(x) && Number.isFinite(y)) pts.push([x,y]);
    }
    if(pts.length < degree + 1) return;

    const coeffs = polyFit(pts, degree);
    if(!coeffs) return;

    const ctx = this.ctx;
    ctx.fillStyle = e.color;
    pts.forEach(p=>{
      const s = this.worldToScreen(p[0], p[1]);
      ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI*2); ctx.fill();
    });

    const min = this.screenToWorld(0, this.height);
    const max = this.screenToWorld(this.width, 0);
    ctx.strokeStyle = e.color; ctx.lineWidth = 2.2; ctx.beginPath();
    let started = false;
    const N = 600;
    for(let i = 0; i <= N; i++){
      const x = min.x + (max.x - min.x) * i / N;
      let y = 0;
      for(let k = 0; k < coeffs.length; k++) y += coeffs[k] * Math.pow(x, k);
      if(!Number.isFinite(y)){ started = false; continue; }
      const p = this.worldToScreen(x, y);
      if(!started){ ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  },

  plotComplex(e, expr){
    const ctx = this.ctx;
    ctx.strokeStyle = e.color; ctx.lineWidth = 2.4; ctx.beginPath();
    let started = false;
    const N = 1200;
    for(let i = 0; i <= N; i++){
      const t = -Math.PI * 2 + Math.PI * 4 * i / N;
      let z;
      try{
        const scope = Object.assign({}, App.buildGlobalScope(), {
          t, pi:Math.PI, e:Math.E, x:t, y:t,
          i: math.complex(0,1)
        });
        if(e.parameters){
          for(const name of Object.keys(e.parameters)){
            const v = Number(e.parameters[name] ? e.parameters[name].value : NaN);
            if(!Number.isFinite(v)) return;
            scope[name] = v;
          }
        }
        z = math.evaluate(expr, scope);
      }catch(_){ started = false; continue; }

      let re, im;
      if(z && typeof z === "object" && "re" in z){ re = z.re; im = z.im; }
      else if(typeof z === "number"){ re = z; im = 0; }
      else { started = false; continue; }

      if(!Number.isFinite(re) || !Number.isFinite(im)){ started = false; continue; }
      const p = this.worldToScreen(re, im);
      if(!started){ ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  },

  drawObjects(){
    const ctx = this.ctx;
    App.state.points.forEach(p=>{
      const q = this.worldToScreen(p.x, p.y);
      ctx.fillStyle = "#111827";
      ctx.beginPath(); ctx.arc(q.x, q.y, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#111827";
      ctx.font = "12px Segoe UI";
      ctx.fillText(p.label, q.x+8, q.y-8);
    });
    App.state.segments.forEach(s=>{
      const a = this.worldToScreen(s.a.x, s.a.y), b = this.worldToScreen(s.b.x, s.b.y);
      ctx.strokeStyle = "#7b3fe4"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    });
    App.state.circles.forEach(c=>{
      const q = this.worldToScreen(c.x, c.y);
      ctx.strokeStyle = "#e67e22"; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(q.x, q.y, c.r*this.scale, c.r*this.scaleY, 0, 0, Math.PI*2);
      ctx.stroke();
      ctx.fillStyle = "#e67e22";
      ctx.beginPath(); ctx.arc(q.x, q.y, 4, 0, Math.PI*2); ctx.fill();
    });
  },

  drawTrace(){
    const e = App.state.expressions.find(x=>x.id === App.state.selected && x.visible);
    if(!e || !e.text.trim()) return;
    const cls = this.classifyExpression(e.text);

    let wx, wy;
    if(cls.type === "y-of-x"){
      wx = this.screenToWorld(this.pointerX || this.width/2, 0).x;
      wy = this.evalExpr(cls.expr, { x:wx }, e);
    } else if(cls.type === "x-of-y"){
      wy = this.screenToWorld(0, this.pointerY || this.height/2).y;
      wx = this.evalExpr(cls.expr, { y:wy }, e);
    } else return;

    if(!Number.isFinite(wx) || !Number.isFinite(wy)) return;
    const p = this.worldToScreen(wx, wy);
    const ctx = this.ctx;
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = e.color;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(p.x, this.oy); ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "#182235";
    ctx.font = "600 12px Inter, sans-serif";
    ctx.fillText(`(${wx.toFixed(3)}, ${wy.toFixed(3)})`, p.x + 12, p.y - 12);
  }
};

/* ============================== helpers ================================ */

function erfApprox(x){
  const sign = x < 0 ? -1 : 1; x = Math.abs(x);
  const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;
  const t = 1/(1+p*x);
  const y = 1 - (((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t)*Math.exp(-x*x);
  return sign*y;
}
function gammaApprox(z){
  const p=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,
           12.507343278686905,-.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z < .5) return Math.PI/(Math.sin(Math.PI*z)*gammaApprox(1-z));
  z -= 1; let x = .99999999999980993;
  for(let i=0;i<p.length;i++) x += p[i]/(z+i+1);
  const t = z + p.length - .5;
  return Math.sqrt(2*Math.PI)*Math.pow(t, z+.5)*Math.exp(-t)*x;
}

/* ======================== project-level actions ======================== */

App.newProject = function(){
  if(!confirm("Start a new project? Unsaved expressions will be cleared.")) return;
  this.state.expressions = [];
  this.state.selected = null;
  this.state.parameterAnimations = {};
  this.state.globals = {};
  this.addExpression();
  this.pushHistory();
  this.render();
};

/* ============================== events ================================= */

document.getElementById("graph").addEventListener("pointermove", e=>{
  if(!Graph.canvas) return;
  const r = Graph.canvas.getBoundingClientRect();
  Graph.pointerX = e.clientX - r.left;
  Graph.pointerY = e.clientY - r.top;
  if(App.state.trace) Graph.request();
});

document.addEventListener("keydown", e=>{
  const inInput = e.target && e.target.classList && e.target.classList.contains("expr-input");
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){
    if(inInput) return;
    e.preventDefault();
    e.shiftKey ? App.redo() : App.undo();
  }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y"){
    if(inInput) return;
    e.preventDefault();
    App.redo();
  }
  if(e.key === "Escape"){
    document.getElementById("dialogBackdrop").classList.remove("show");
    Autocomplete.hide();
  }
});

document.addEventListener("input", function(ev){
  const el = ev.target;
  if(!el.matches(
    ".inline-param-min,.inline-param-max,.inline-param-value," +
    ".parameter-edit-min,.parameter-edit-max,.parameter-edit-value"
  )) return;
  if(el.type === "number" && typeof el.value === "string"){
    const cleaned = el.value.replace(/[^0-9eE+.\-]/g,"");
    if(cleaned !== el.value){
      const pos = el.selectionStart;
      el.value = cleaned;
      if(typeof pos === "number"){
        try{ el.setSelectionRange(Math.min(pos, cleaned.length), Math.min(pos, cleaned.length)); }catch(_){}
      }
    }
  }
});

window.addEventListener("load", async ()=>{
  if(typeof math === "undefined"){
    try{
      await new Promise((resolve, reject)=>{
        const script = document.createElement("script");
        script.src = "https://unpkg.com/mathjs@14.0.1/lib/browser/math.js";
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }catch(err){
      console.error("GANITH math engine could not load from either CDN.", err);
    }
  }
  App.init();
});
